<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JLPT 文法卡片 — N5 到 N1 全套</title>
<style>
  :root {
    --n5: #f39c12; --n4: #54a0ff; --n3: #a855f7; --n2: #10ac84; --n1: #ee5a24;
    --bg: #0e0e12;
    --card: #16161e;
    --border: rgba(255,255,255,0.07);
    --tx: #f0f0f5;
    --muted: rgba(240,240,245,0.45);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--tx);
    font-family: 'Noto Sans JP', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── GRID BACKGROUND ── */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  /* ── GLOW ── */
  .glow {
    position: fixed;
    width: 600px; height: 600px;
    border-radius: 50%;
    filter: blur(120px);
    opacity: 0.12;
    pointer-events: none;
    z-index: 0;
  }
  .glow-1 { background: #10ac84; top: -200px; left: -100px; }
  .glow-2 { background: #ee5a24; bottom: -200px; right: -100px; }

  /* ── LAYOUT ── */
  .wrap {
    position: relative;
    z-index: 1;
    max-width: 860px;
    margin: 0 auto;
    padding: 0 24px 80px;
  }

  /* ── HEADER ── */
  header {
    padding: 48px 0 0;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .badge-jlpt {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 3px;
    color: var(--muted);
    border: 1px solid var(--border);
    padding: 5px 10px;
    border-radius: 4px;
    text-transform: uppercase;
    text-decoration: none;
    display: inline-block;
    transition: color 0.2s, border-color 0.2s;
  }
  .badge-jlpt:hover { color: var(--tx); border-color: rgba(255,255,255,0.2); }

  /* ── HERO ── */
  .hero {
    padding: 40px 0 28px;
  }

  .hero-eyebrow {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 4px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 14px;
  }

  .hero-title {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(36px, 8vw, 60px);
    font-weight: 400;
    line-height: 1.1;
    letter-spacing: 0.5px;
  }

  .hero-title em {
    font-style: normal;
    background: linear-gradient(90deg, #10ac84, #54a0ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  /* ── LEVEL CARDS ── */
  .levels {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
    margin: 40px 0;
  }

  .lv {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 14px;
    text-align: center;
    text-decoration: none;
    color: var(--tx);
    transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    position: relative;
    overflow: hidden;
    cursor: pointer;
  }

  .lv::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--c);
    opacity: 0.8;
  }

  .lv:hover {
    transform: translateY(-4px);
    border-color: var(--c);
    box-shadow: 0 12px 40px -8px var(--c-glow);
  }

  .lv-tag {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: 2px;
    color: var(--c);
    font-weight: 700;
    margin-bottom: 8px;
    opacity: 0.9;
  }

  .lv-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 44px; height: 44px;
    border-radius: 12px;
    background: color-mix(in srgb, var(--c) 15%, transparent);
    font-size: 20px;
    font-weight: 900;
    color: var(--c);
    margin: 6px auto;
    font-family: 'Space Mono', monospace;
  }

  .lv-count {
    font-size: 12px;
    color: var(--muted);
    margin-top: 6px;
  }

  .lv-count strong {
    color: var(--tx);
    font-size: 16px;
    font-weight: 700;
    display: block;
  }

  /* ── RANDOM PLAY ── */
  .random-play {
    display: flex; align-items: center; gap: 10px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 14px 16px;
    margin: 0 0 14px;
  }
  .random-play select {
    background: var(--bg); color: var(--tx); border: 1px solid var(--border);
    border-radius: 8px; padding: 9px 10px; font-size: 14px; font-family: inherit;
    flex-shrink: 0;
  }
  .random-play button {
    flex: 1;
    background: linear-gradient(120deg, #0f8f74, #2f6fb0);
    box-shadow: 0 6px 18px rgba(16,172,132,0.22);
    color: #fff; border: none; border-radius: 10px;
    padding: 11px 16px; font-size: 14px; font-weight: 700; font-family: inherit;
    cursor: pointer; transition: opacity 0.2s, box-shadow 0.2s;
  }
  .random-play button:hover { opacity: 0.88; }
  .random-play button:disabled { opacity: 0.5; cursor: default; box-shadow: none; }
  .random-play button.playing { background: #3a3a42; box-shadow: none; }

  .rp-full-btn {
    flex: 0 0 auto !important;
    width: 44px; padding: 0 !important;
    background: var(--bg) !important; box-shadow: none !important;
    border: 1px solid var(--border) !important;
    color: var(--tx) !important; font-size: 18px !important;
  }
  .rp-full-btn:hover { background: rgba(255,255,255,0.06) !important; opacity: 1 !important; }

  /* ── FULLSCREEN CAPTION (第二屏投放用) ── */
  .fs-overlay {
    position: fixed; inset: 0; height: 100vh; height: 100dvh; z-index: 9999;
    display: none;
    background: radial-gradient(circle at 50% 32%, #16161f 0%, #08080b 100%);
    overflow: hidden;
  }
  .fs-overlay.active { display: flex; }
  /* 内层单独滚动、外层高度用 100dvh 钉死不随地址栏收起/展开变化——
     外层如果也跟着滚动，iOS Safari 会把这当成"页面在滚"，反复触发
     状态栏/地址栏的隐藏动画，又耗电又一直闪烁 */
  .fs-inner {
    width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 6vh 8vw; text-align: center;
    overflow-y: auto; -webkit-overflow-scrolling: touch;
  }
  .fs-exit {
    position: absolute; top: 28px; right: 32px;
    width: 46px; height: 46px; border-radius: 50%;
    background: rgba(255,255,255,0.06); border: 1px solid var(--border);
    color: var(--muted); font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s, color 0.2s;
  }
  .fs-exit:hover { background: rgba(255,255,255,0.14); color: var(--tx); }
  .fs-eyebrow {
    font-family: 'Space Mono', monospace;
    font-size: clamp(12px, 1.3vw, 17px);
    letter-spacing: 5px; color: var(--muted); text-transform: uppercase;
    margin-bottom: 4.5vh;
  }
  .fs-pattern {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(26px, 3vw, 44px);
    color: #6fd6b8; letter-spacing: 1px; margin-bottom: 3vh;
    transition: opacity 0.25s ease;
  }
  .fs-sentence {
    font-size: clamp(34px, 5.6vw, 84px);
    font-weight: 700; line-height: 1.45; max-width: 92vw;
    margin-bottom: 4vh; transition: opacity 0.25s ease;
  }
  .fs-sentence .hl, .fs-sentence .gm {
    background: linear-gradient(90deg, #10ac84, #54a0ff);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .fs-zh {
    font-size: clamp(19px, 2.4vw, 34px);
    color: var(--tx); opacity: 0.82; max-width: 86vw;
    margin-bottom: 5vh; line-height: 1.55; transition: opacity 0.25s ease;
  }
  .fs-meaning {
    font-size: clamp(22px, 2.8vw, 42px);
    font-weight: 700;
    color: #dfe6ff; max-width: 80vw; line-height: 1.5;
    padding-top: 3vh; border-top: 1px solid var(--border);
    transition: opacity 0.25s ease;
  }

  .rp-caption {
    display: none;
    padding: 4px 4px 18px;
    text-align: center;
  }
  .rp-caption.show { display: block; }
  .rp-caption .rp-tag {
    font-family: 'Space Mono', monospace;
    font-size: 10px; letter-spacing: 2px; color: var(--muted);
    margin-bottom: 8px;
  }
  .rp-caption .rp-jp { font-size: 17px; font-weight: 700; line-height: 1.6; }
  .rp-caption .rp-zh { font-size: 13px; color: var(--muted); margin-top: 6px; line-height: 1.5; }

  /* ── COMPANION LINK ── */
  .companion-link {
    display: flex; justify-content: space-between; align-items: center;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 18px 22px;
    margin: 20px 0 40px;
    text-decoration: none; color: var(--tx);
    transition: border-color 0.2s, transform 0.2s;
  }
  .companion-link:hover { border-color: rgba(255,255,255,0.2); transform: translateY(-2px); }
  .comp-left { display: flex; align-items: center; gap: 14px; }
  .comp-icon { font-size: 28px; }
  .comp-title { font-weight: 700; font-size: 16px; }
  .comp-sub { font-size: 12px; opacity: 0.6; margin-top: 3px; }
  .comp-arrow { font-size: 22px; opacity: 0.5; }

  /* ── SUPPORT LINE ── */
  .support-line {
    text-align: center;
    font-size: 13px;
    color: var(--muted);
    margin: 10px 0 0;
  }
  .support-line a { color: inherit; text-decoration: none; }
  .support-line a:hover { color: var(--tx); }

  /* ── FOOTER ── */
  footer {
    text-align: center;
    padding: 32px 0 0;
    font-size: 12px;
    color: var(--muted);
    font-family: 'Space Mono', monospace;
  }

  /* ── ANIMATIONS ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .hero, .levels {
    animation: fadeUp 0.6s ease both;
  }
  .levels { animation-delay: 0.1s; }

  /* ── MOBILE ── */
  @media (max-width: 600px) {
    .levels { grid-template-columns: repeat(5, 1fr); gap: 6px; }
    .lv { padding: 12px 6px; border-radius: 10px; }
    .lv-badge { width: 34px; height: 34px; font-size: 14px; border-radius: 8px; }
    .lv-count strong { font-size: 13px; }
    .lv-count { font-size: 10px; }

    /* 手机屏幕竖着的时候空间紧张，全屏朗读的间距和字号都收紧一些，
       尽量让一屏能看全，不够再靠 .fs-inner 的 overflow-y 滚动兜底 */
    .fs-inner { padding: 5vh 6vw 4vh; }
    .fs-exit { top: 16px; right: 16px; width: 40px; height: 40px; font-size: 16px; }
    .fs-eyebrow { margin-bottom: 2.5vh; }
    .fs-pattern { font-size: clamp(20px, 6vw, 30px); margin-bottom: 2vh; }
    .fs-sentence { font-size: clamp(26px, 8vw, 44px); line-height: 1.4; margin-bottom: 2.5vh; }
    .fs-zh { font-size: clamp(15px, 4.5vw, 20px); margin-bottom: 3vh; }
    .fs-meaning { font-size: clamp(16px, 5vw, 24px); padding-top: 2vh; }
  }
</style>
</head>
<body>

<div class="glow glow-1"></div>
<div class="glow glow-2"></div>

<div class="wrap">

  <header>
    <a class="badge-jlpt" href="/">JLPT · 日本語能力試験</a>
  </header>

  <!-- HERO -->
  <section class="hero">
    <div class="hero-eyebrow">Grammar Cards</div>
    <h1 class="hero-title">文法<em>卡片</em></h1>
  </section>

  <!-- LEVEL CARDS -->
  <div class="levels">
    <a class="lv" href="n5.html" style="--c:var(--n5);--c-glow:rgba(243,156,18,0.3)">
      <div class="lv-tag">入門</div>
      <div class="lv-badge">N5</div>
      <div class="lv-count"><strong>64</strong>条文法</div>
    </a>
    <a class="lv" href="n4.html" style="--c:var(--n4);--c-glow:rgba(84,160,255,0.3)">
      <div class="lv-tag">初級</div>
      <div class="lv-badge">N4</div>
      <div class="lv-count"><strong>90</strong>条文法</div>
    </a>
    <a class="lv" href="n3.html" style="--c:var(--n3);--c-glow:rgba(168,85,247,0.3)">
      <div class="lv-tag">中級</div>
      <div class="lv-badge">N3</div>
      <div class="lv-count"><strong>155</strong>条文法</div>
    </a>
    <a class="lv" href="n2.html" style="--c:var(--n2);--c-glow:rgba(16,172,132,0.3)">
      <div class="lv-tag">中上級</div>
      <div class="lv-badge">N2</div>
      <div class="lv-count"><strong>143</strong>条文法</div>
    </a>
    <a class="lv" href="n1.html" style="--c:var(--n1);--c-glow:rgba(238,90,36,0.3)">
      <div class="lv-tag">上級</div>
      <div class="lv-badge">N1</div>
      <div class="lv-count"><strong>246</strong>条文法</div>
    </a>
  </div>

  <div class="random-play">
    <select id="rp-level" aria-label="选择等级">
      <option value="n5">N5</option>
      <option value="n4">N4</option>
      <option value="n3">N3</option>
      <option value="n2">N2</option>
      <option value="n1" selected>N1</option>
    </select>
    <button id="rp-btn">随机播放例句</button>
    <button id="rp-full" class="rp-full-btn" title="全屏播放（投到副屏用）">⛶</button>
  </div>

  <div class="rp-caption" id="rp-caption">
    <div class="rp-tag" id="rp-tag"></div>
    <div class="rp-jp" id="rp-jp"></div>
    <div class="rp-zh" id="rp-zh"></div>
  </div>

  <div class="fs-overlay" id="fsOverlay">
    <button class="fs-exit" id="fsExit" title="退出全屏 (Esc)">✕</button>
    <div class="fs-inner">
      <div class="fs-eyebrow" id="fsEyebrow">随机文法</div>
      <div class="fs-pattern" id="fsPattern"></div>
      <div class="fs-sentence" id="fsSentence"></div>
      <div class="fs-zh" id="fsZh"></div>
      <div class="fs-meaning" id="fsMeaning"></div>
    </div>
  </div>

  <a class="companion-link" href="/">
    <div class="comp-left">
      <div class="comp-icon">🎴</div>
      <div>
        <div class="comp-title">語彙卡片</div>
        <div class="comp-sub">7284 个 N5 → N1 词汇</div>
      </div>
    </div>
    <div class="comp-arrow">›</div>
  </a>

  <footer>
    <p>© 2025 jlptcards.app · 无追踪 · 无广告</p>
    <p class="support-line">如果帮到你，欢迎<a href="/support.html">支持一下</a></p>
  </footer>

</div>

<script>
(function () {
  // 朗读引擎：照搬 recall.js 里已经踩过坑、验证过的写法——
  // iOS Safari 要求 speak() 必须在点击的调用栈内同步触发一次才会"解锁"；
  // speak() 后不能紧跟 cancel()（会把引擎晾在暂停状态，之后静默不出声）；
  // Chrome 标签页后台一段时间会挂起引擎，需要定期 pause/resume 保活；
  // cancel() 之后不保证触发 onend/onerror，需要超时兜底避免卡死。
  const TTS = {
    _supported: 'speechSynthesis' in window,
    _jaVoice: null,
    _pendingDone: null,
    _pendingTimer: null,
    _keepAliveTimer: null,
    init() {
      if (!this._supported) return;
      const pick = () => {
        const voices = speechSynthesis.getVoices();
        this._jaVoice = voices.find(v => v.lang.startsWith('ja')) || null;
      };
      pick();
      speechSynthesis.addEventListener('voiceschanged', pick);
    },
    unlock() {
      if (!this._supported) return;
      try {
        const u = new SpeechSynthesisUtterance('.');
        u.volume = 0;
        speechSynthesis.speak(u);
      } catch {}
    },
    _startKeepAlive() {
      if (!this._supported || this._keepAliveTimer) return;
      this._keepAliveTimer = setInterval(() => {
        speechSynthesis.pause();
        speechSynthesis.resume();
      }, 5000);
    },
    _stopKeepAlive() {
      clearInterval(this._keepAliveTimer);
      this._keepAliveTimer = null;
    },
    speak(text) {
      if (!this._supported) return Promise.resolve();
      this._startKeepAlive();
      return new Promise((resolve) => {
        const done = () => {
          if (this._pendingDone !== done) return;
          this._pendingDone = null;
          clearTimeout(this._pendingTimer);
          resolve();
        };
        this._pendingDone = done;
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'ja-JP';
        u.voice = this._jaVoice;
        u.onend = done;
        u.onerror = done;
        speechSynthesis.speak(u);
        this._pendingTimer = setTimeout(done, 8000);
      });
    },
    cancel() {
      if (this._supported) speechSynthesis.cancel();
      if (this._pendingDone) this._pendingDone();
      this._stopKeepAlive();
    }
  };
  TTS.init();

  // 播放预先生成好的真人语音文件(grammar/audio/{level}/{id}.mp3)；
  // 复用同一个 <audio> 元素，第一次在点击回调里同步 play() 一下"解锁"，
  // 之后异步流程里换 src 继续 play() 才不会被 iOS Safari 拦截。
  const AudioPlayer = {
    el: new Audio(),
    unlock() {
      try {
        this.el.muted = true;
        this.el.play().catch(() => {});
        this.el.pause();
        this.el.muted = false;
      } catch {}
    },
    play(src) {
      return new Promise((resolve, reject) => {
        let done = false;
        const finish = (ok) => {
          if (done) return;
          done = true;
          this.el.removeEventListener('ended', onEnd);
          this.el.removeEventListener('error', onError);
          clearTimeout(timer);
          ok ? resolve() : reject(new Error('audio play failed'));
        };
        const onEnd = () => finish(true);
        const onError = () => finish(false);
        this.el.addEventListener('ended', onEnd);
        this.el.addEventListener('error', onError);
        const timer = setTimeout(() => finish(true), 8000);
        this.el.src = src;
        this.el.currentTime = 0;
        this.el.play().catch(() => finish(false));
      });
    },
    cancel() {
      try { this.el.pause(); this.el.removeAttribute('src'); this.el.load(); } catch {}
    }
  };

  function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  const levelSelect = document.getElementById('rp-level');
  const btn = document.getElementById('rp-btn');
  const caption = document.getElementById('rp-caption');
  const captionTag = document.getElementById('rp-tag');
  const captionJp = document.getElementById('rp-jp');
  const captionZh = document.getElementById('rp-zh');
  const fullBtn = document.getElementById('rp-full');
  const fsOverlay = document.getElementById('fsOverlay');
  const fsExit = document.getElementById('fsExit');
  const fsEyebrow = document.getElementById('fsEyebrow');
  const fsPattern = document.getElementById('fsPattern');
  const fsSentence = document.getElementById('fsSentence');
  const fsZh = document.getElementById('fsZh');
  const fsMeaning = document.getElementById('fsMeaning');
  const cache = {};
  let playing = false;
  let stopRequested = false;


  async function loadLevel(lvl) {
    if (cache[lvl]) return cache[lvl];
    const res = await fetch(`data/examples-${lvl}.json`);
    if (!res.ok) throw new Error(`加载失败: ${res.status}`);
    const data = await res.json();
    cache[lvl] = data;
    return data;
  }

  // 锁屏/通知栏的"正在播放"卡片：把当前朗读的日语例句设成标题，这样锁屏时
  // 也能看到"字幕"，不用点亮屏幕。播放/暂停这两个系统级按钮也接到我们自己的
  // 开始/停止逻辑上，不然锁屏上点了会没反应。
  const hasMediaSession = 'mediaSession' in navigator;
  function updateNowPlaying(title, artist, album) {
    if (!hasMediaSession) return;
    try {
      navigator.mediaSession.metadata = new MediaMetadata({ title, artist, album });
    } catch {}
  }
  if (hasMediaSession) {
    navigator.mediaSession.setActionHandler('play', () => { if (!playing) btn.click(); });
    navigator.mediaSession.setActionHandler('pause', () => { if (playing) btn.click(); });
    navigator.mediaSession.setActionHandler('stop', () => { if (playing) btn.click(); });
  }

  // 打乱后按顺序播完一轮就重新打乱，无限循环，直到 stopRequested；
  // 同一个文法点的主例句+补充例句连着读完，再切换到下一个（随机的）文法点，方便记忆。
  async function playLoop(lvl) {
    let queue = shuffle(await loadLevel(lvl));
    let idx = 0;
    while (!stopRequested) {
      if (idx >= queue.length) {
        queue = shuffle(queue);
        idx = 0;
      }
      const item = queue[idx++];
      captionTag.textContent = item.t;
      const sentences = [
        { text: item.e, html: item.eh, z: item.z },
        ...(item.ex || []).map(x => ({ text: x.j, html: x.jh, z: x.z })),
      ];
      for (let i = 0; i < sentences.length; i++) {
        if (stopRequested) break;
        const s = sentences[i];
        captionJp.textContent = s.text;
        captionZh.textContent = s.z;
        updateNowPlaying(s.text, item.t, s.z);
        fsEyebrow.textContent = `${lvl.toUpperCase()} · 随机文法`;
        fsPattern.textContent = item.t;
        fsSentence.innerHTML = s.html || s.text;
        fsZh.textContent = s.z;
        fsMeaning.textContent = item.mz || '';
        try {
          await AudioPlayer.play(`audio/${lvl}/${item.id}-${i}.mp3`);
        } catch {
          // 万一某条音频文件缺失/加载失败，退回浏览器朗读，不中断整个播放
          await TTS.speak(s.text);
        }
        if (stopRequested) break;
        await sleep(i < sentences.length - 1 ? 300 : 500);
      }
    }
  }

  btn.addEventListener('click', async () => {
    if (playing) {
      stopRequested = true;
      AudioPlayer.cancel();
      TTS.cancel();
      return;
    }
    AudioPlayer.unlock();
    TTS.unlock();
    playing = true;
    stopRequested = false;
    levelSelect.disabled = true;
    btn.textContent = '⏹ 停止';
    btn.classList.add('playing');
    caption.classList.add('show');
    if (hasMediaSession) navigator.mediaSession.playbackState = 'playing';
    const lvl = levelSelect.value;
    try {
      await playLoop(lvl);
    } catch (err) {
      console.error('随机播放例句出错', err);
    } finally {
      AudioPlayer.cancel();
      TTS.cancel();
      if (hasMediaSession) { navigator.mediaSession.playbackState = 'none'; navigator.mediaSession.metadata = null; }
      playing = false;
      stopRequested = false;
      levelSelect.disabled = false;
      caption.classList.remove('show');
      btn.textContent = '随机播放例句';
      btn.classList.remove('playing');
    }
  });

  // 全屏投放：给第二块屏幕看的大字幕模式。优先申请浏览器原生全屏(桌面端支持好)，
  // 拿不到就退回一个铺满视口的固定层，视觉效果一样；两种情况都用 .active 这个
  // class 控制显示，不依赖 :fullscreen 伪类，避免不支持原生全屏的环境下什么都看不到。
  function exitFullscreenMode() {
    fsOverlay.classList.remove('active');
    if (document.fullscreenElement) { try { document.exitFullscreen(); } catch {} }
  }
  fullBtn.addEventListener('click', () => {
    if (fsOverlay.classList.contains('active')) { exitFullscreenMode(); return; }
    // requestFullscreen 必须在点击的调用栈内同步发起才会被浏览器允许，不能等 btn.click() 里的 await 之后再调用
    fsOverlay.classList.add('active');
    try { fsOverlay.requestFullscreen?.(); } catch {}
    if (!playing) btn.click();
  });
  fsExit.addEventListener('click', exitFullscreenMode);
  document.addEventListener('fullscreenchange', () => {
    if (!document.fullscreenElement) fsOverlay.classList.remove('active');
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && fsOverlay.classList.contains('active')) exitFullscreenMode();
  });
})();
</script>

</body>
</html>
