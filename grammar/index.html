<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JLPT 文法卡片 — N5 到 N1 全套</title>
<style>
  :root {
    --n5: #f39c12; --n4: #54a0ff; --n3: #a855f7; --n2: #10ac84; --n1: #ee5a24;
    --bg: #0e0e12;
    --card: #16161e;
    --border: rgba(255,255,255,0.07);
    --tx: #f0f0f5;
    --muted: rgba(240,240,245,0.45);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--tx);
    font-family: 'Noto Sans JP', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── GRID BACKGROUND ── */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  /* ── GLOW ── */
  .glow {
    position: fixed;
    width: 600px; height: 600px;
    border-radius: 50%;
    filter: blur(120px);
    opacity: 0.12;
    pointer-events: none;
    z-index: 0;
  }
  .glow-1 { background: #10ac84; top: -200px; left: -100px; }
  .glow-2 { background: #ee5a24; bottom: -200px; right: -100px; }

  /* ── LAYOUT ── */
  .wrap {
    position: relative;
    z-index: 1;
    max-width: 860px;
    margin: 0 auto;
    padding: 0 24px 80px;
  }

  /* ── HEADER ── */
  header {
    padding: 48px 0 0;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .badge-jlpt {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 3px;
    color: var(--muted);
    border: 1px solid var(--border);
    padding: 5px 10px;
    border-radius: 4px;
    text-transform: uppercase;
  }

  /* ── HERO ── */
  .hero {
    padding: 52px 0 48px;
  }

  .hero-label {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 4px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 20px;
  }

  .hero h1 {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(38px, 7vw, 64px);
    line-height: 1.08;
    font-weight: 400;
    margin-bottom: 10px;
  }

  .hero h1 em {
    font-style: italic;
    background: linear-gradient(90deg, #10ac84, #54a0ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .hero-sub {
    font-size: 16px;
    color: var(--muted);
    line-height: 1.7;
    max-width: 520px;
    margin-top: 18px;
  }

  /* ── LEVEL CARDS ── */
  .levels {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
    margin: 40px 0;
  }

  .lv {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 14px;
    text-align: center;
    text-decoration: none;
    color: var(--tx);
    transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    position: relative;
    overflow: hidden;
    cursor: pointer;
  }

  .lv::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--c);
    opacity: 0.8;
  }

  .lv:hover {
    transform: translateY(-4px);
    border-color: var(--c);
    box-shadow: 0 12px 40px -8px var(--c-glow);
  }

  .lv-tag {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: 2px;
    color: var(--c);
    font-weight: 700;
    margin-bottom: 8px;
    opacity: 0.9;
  }

  .lv-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 44px; height: 44px;
    border-radius: 12px;
    background: color-mix(in srgb, var(--c) 15%, transparent);
    font-size: 20px;
    font-weight: 900;
    color: var(--c);
    margin: 6px auto;
    font-family: 'Space Mono', monospace;
  }

  .lv-count {
    font-size: 12px;
    color: var(--muted);
    margin-top: 6px;
  }

  .lv-count strong {
    color: var(--tx);
    font-size: 16px;
    font-weight: 700;
    display: block;
  }

  /* ── RANDOM PLAY ── */
  .random-play {
    display: flex; align-items: center; gap: 10px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 14px 16px;
    margin: 0 0 14px;
  }
  .random-play select {
    background: var(--bg); color: var(--tx); border: 1px solid var(--border);
    border-radius: 8px; padding: 9px 10px; font-size: 14px; font-family: inherit;
    flex-shrink: 0;
  }
  .random-play button {
    flex: 1;
    background: var(--n2); color: #fff; border: none; border-radius: 10px;
    padding: 11px 16px; font-size: 14px; font-weight: 700; font-family: inherit;
    cursor: pointer; transition: opacity 0.2s, background 0.2s;
  }
  .random-play button:hover { opacity: 0.85; }
  .random-play button:disabled { opacity: 0.5; cursor: default; }
  .random-play button.playing { background: #55555a; }

  .rp-caption {
    display: none;
    padding: 4px 4px 18px;
    text-align: center;
  }
  .rp-caption.show { display: block; }
  .rp-caption .rp-tag {
    font-family: 'Space Mono', monospace;
    font-size: 10px; letter-spacing: 2px; color: var(--muted);
    margin-bottom: 8px;
  }
  .rp-caption .rp-jp { font-size: 17px; font-weight: 700; line-height: 1.6; }
  .rp-caption .rp-zh { font-size: 13px; color: var(--muted); margin-top: 6px; line-height: 1.5; }

  /* ── COMPANION LINK ── */
  .companion-link {
    display: flex; justify-content: space-between; align-items: center;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 18px 22px;
    margin: 20px 0 40px;
    text-decoration: none; color: var(--tx);
    transition: border-color 0.2s, transform 0.2s;
  }
  .companion-link:hover { border-color: rgba(255,255,255,0.2); transform: translateY(-2px); }
  .comp-left { display: flex; align-items: center; gap: 14px; }
  .comp-icon { font-size: 28px; }
  .comp-title { font-weight: 700; font-size: 16px; }
  .comp-sub { font-size: 12px; opacity: 0.6; margin-top: 3px; }
  .comp-arrow { font-size: 22px; opacity: 0.5; }

  /* ── SUPPORT LINE ── */
  .support-line {
    text-align: center;
    font-size: 13px;
    color: var(--muted);
    margin: 0 0 40px;
  }
  .support-line a { color: inherit; text-decoration: none; }
  .support-line a:hover { color: var(--tx); }

  /* ── FOOTER ── */
  footer {
    text-align: center;
    padding: 32px 0 0;
    font-size: 12px;
    color: var(--muted);
    font-family: 'Space Mono', monospace;
  }

  /* ── ANIMATIONS ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .hero, .levels {
    animation: fadeUp 0.6s ease both;
  }
  .levels { animation-delay: 0.1s; }

  /* ── MOBILE ── */
  @media (max-width: 600px) {
    .levels { grid-template-columns: repeat(5, 1fr); gap: 6px; }
    .lv { padding: 12px 6px; border-radius: 10px; }
    .lv-badge { width: 34px; height: 34px; font-size: 14px; border-radius: 8px; }
    .lv-count strong { font-size: 13px; }
    .lv-count { font-size: 10px; }
    .hero h1 { font-size: 36px; }
  }
</style>
</head>
<body>

<div class="glow glow-1"></div>
<div class="glow glow-2"></div>

<div class="wrap">

  <header>
    <div class="badge-jlpt">JLPT · 日本語能力試験</div>
  </header>

  <!-- HERO -->
  <section class="hero">
    <div class="hero-label">文法卡片 / Grammar Cards</div>
    <h1>从 N5 到 N1，<br><em>全部搞定。</em></h1>
    <p class="hero-sub">
      626 条文法要点，例句全部可点击朗读，中文翻译 + 接续说明一目了然。
    </p>
  </section>

  <!-- LEVEL CARDS -->
  <div class="levels">
    <a class="lv" href="n5.html" style="--c:var(--n5);--c-glow:rgba(243,156,18,0.3)">
      <div class="lv-tag">入門</div>
      <div class="lv-badge">N5</div>
      <div class="lv-count"><strong>35</strong>条文法</div>
    </a>
    <a class="lv" href="n4.html" style="--c:var(--n4);--c-glow:rgba(84,160,255,0.3)">
      <div class="lv-tag">初級</div>
      <div class="lv-badge">N4</div>
      <div class="lv-count"><strong>75</strong>条文法</div>
    </a>
    <a class="lv" href="n3.html" style="--c:var(--n3);--c-glow:rgba(168,85,247,0.3)">
      <div class="lv-tag">中級</div>
      <div class="lv-badge">N3</div>
      <div class="lv-count"><strong>137</strong>条文法</div>
    </a>
    <a class="lv" href="n2.html" style="--c:var(--n2);--c-glow:rgba(16,172,132,0.3)">
      <div class="lv-tag">中上級</div>
      <div class="lv-badge">N2</div>
      <div class="lv-count"><strong>133</strong>条文法</div>
    </a>
    <a class="lv" href="n1.html" style="--c:var(--n1);--c-glow:rgba(238,90,36,0.3)">
      <div class="lv-tag">上級</div>
      <div class="lv-badge">N1</div>
      <div class="lv-count"><strong>246</strong>条文法</div>
    </a>
  </div>

  <div class="random-play">
    <select id="rp-level" aria-label="选择等级">
      <option value="n5">N5</option>
      <option value="n4">N4</option>
      <option value="n3">N3</option>
      <option value="n2">N2</option>
      <option value="n1" selected>N1</option>
    </select>
    <button id="rp-btn">随机播放例句</button>
  </div>

  <div class="rp-caption" id="rp-caption">
    <div class="rp-tag" id="rp-tag"></div>
    <div class="rp-jp" id="rp-jp"></div>
    <div class="rp-zh" id="rp-zh"></div>
  </div>

  <a class="companion-link" href="/">
    <div class="comp-left">
      <div class="comp-icon">🎴</div>
      <div>
        <div class="comp-title">配套語彙卡片</div>
        <div class="comp-sub">7284 个 N5 → N1 词汇</div>
      </div>
    </div>
    <div class="comp-arrow">›</div>
  </a>

  <p class="support-line">如果帮到你，欢迎<a href="/support.html">支持一下</a></p>

  <footer>
    <p>© 2025 jlptcards.app · 无追踪 · 无广告</p>
  </footer>

</div>

<script>
(function () {
  // 朗读引擎：照搬 recall.js 里已经踩过坑、验证过的写法——
  // iOS Safari 要求 speak() 必须在点击的调用栈内同步触发一次才会"解锁"；
  // speak() 后不能紧跟 cancel()（会把引擎晾在暂停状态，之后静默不出声）；
  // Chrome 标签页后台一段时间会挂起引擎，需要定期 pause/resume 保活；
  // cancel() 之后不保证触发 onend/onerror，需要超时兜底避免卡死。
  const TTS = {
    _supported: 'speechSynthesis' in window,
    _jaVoice: null,
    _pendingDone: null,
    _pendingTimer: null,
    _keepAliveTimer: null,
    init() {
      if (!this._supported) return;
      const pick = () => {
        const voices = speechSynthesis.getVoices();
        this._jaVoice = voices.find(v => v.lang.startsWith('ja')) || null;
      };
      pick();
      speechSynthesis.addEventListener('voiceschanged', pick);
    },
    unlock() {
      if (!this._supported) return;
      try {
        const u = new SpeechSynthesisUtterance('.');
        u.volume = 0;
        speechSynthesis.speak(u);
      } catch {}
    },
    _startKeepAlive() {
      if (!this._supported || this._keepAliveTimer) return;
      this._keepAliveTimer = setInterval(() => {
        speechSynthesis.pause();
        speechSynthesis.resume();
      }, 5000);
    },
    _stopKeepAlive() {
      clearInterval(this._keepAliveTimer);
      this._keepAliveTimer = null;
    },
    speak(text) {
      if (!this._supported) return Promise.resolve();
      this._startKeepAlive();
      return new Promise((resolve) => {
        const done = () => {
          if (this._pendingDone !== done) return;
          this._pendingDone = null;
          clearTimeout(this._pendingTimer);
          resolve();
        };
        this._pendingDone = done;
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'ja-JP';
        u.voice = this._jaVoice;
        u.onend = done;
        u.onerror = done;
        speechSynthesis.speak(u);
        this._pendingTimer = setTimeout(done, 8000);
      });
    },
    cancel() {
      if (this._supported) speechSynthesis.cancel();
      if (this._pendingDone) this._pendingDone();
      this._stopKeepAlive();
    }
  };
  TTS.init();

  // 播放预先生成好的真人语音文件(grammar/audio/{level}/{id}.mp3)；
  // 复用同一个 <audio> 元素，第一次在点击回调里同步 play() 一下"解锁"，
  // 之后异步流程里换 src 继续 play() 才不会被 iOS Safari 拦截。
  const AudioPlayer = {
    el: new Audio(),
    unlock() {
      try {
        this.el.muted = true;
        this.el.play().catch(() => {});
        this.el.pause();
        this.el.muted = false;
      } catch {}
    },
    play(src) {
      return new Promise((resolve, reject) => {
        let done = false;
        const finish = (ok) => {
          if (done) return;
          done = true;
          this.el.removeEventListener('ended', onEnd);
          this.el.removeEventListener('error', onError);
          clearTimeout(timer);
          ok ? resolve() : reject(new Error('audio play failed'));
        };
        const onEnd = () => finish(true);
        const onError = () => finish(false);
        this.el.addEventListener('ended', onEnd);
        this.el.addEventListener('error', onError);
        const timer = setTimeout(() => finish(true), 8000);
        this.el.src = src;
        this.el.currentTime = 0;
        this.el.play().catch(() => finish(false));
      });
    },
    cancel() {
      try { this.el.pause(); this.el.removeAttribute('src'); this.el.load(); } catch {}
    }
  };

  function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  const levelSelect = document.getElementById('rp-level');
  const btn = document.getElementById('rp-btn');
  const caption = document.getElementById('rp-caption');
  const captionTag = document.getElementById('rp-tag');
  const captionJp = document.getElementById('rp-jp');
  const captionZh = document.getElementById('rp-zh');
  const cache = {};
  let playing = false;
  let stopRequested = false;


  async function loadLevel(lvl) {
    if (cache[lvl]) return cache[lvl];
    const res = await fetch(`data/examples-${lvl}.json`);
    if (!res.ok) throw new Error(`加载失败: ${res.status}`);
    const data = await res.json();
    cache[lvl] = data;
    return data;
  }

  // 打乱后按顺序播完一轮就重新打乱，无限循环，直到 stopRequested；
  // 同一个文法点的主例句+补充例句连着读完，再切换到下一个（随机的）文法点，方便记忆。
  async function playLoop(lvl) {
    let queue = shuffle(await loadLevel(lvl));
    let idx = 0;
    while (!stopRequested) {
      if (idx >= queue.length) {
        queue = shuffle(queue);
        idx = 0;
      }
      const item = queue[idx++];
      captionTag.textContent = item.t;
      const sentences = [
        { text: item.e, z: item.z },
        ...(item.ex || []).map(x => ({ text: x.j, z: x.z })),
      ];
      for (let i = 0; i < sentences.length; i++) {
        if (stopRequested) break;
        const s = sentences[i];
        captionJp.textContent = s.text;
        captionZh.textContent = s.z;
        try {
          await AudioPlayer.play(`audio/${lvl}/${item.id}-${i}.mp3`);
        } catch {
          // 万一某条音频文件缺失/加载失败，退回浏览器朗读，不中断整个播放
          await TTS.speak(s.text);
        }
        if (stopRequested) break;
        await sleep(i < sentences.length - 1 ? 300 : 500);
      }
    }
  }

  btn.addEventListener('click', async () => {
    if (playing) {
      stopRequested = true;
      AudioPlayer.cancel();
      TTS.cancel();
      return;
    }
    AudioPlayer.unlock();
    TTS.unlock();
    playing = true;
    stopRequested = false;
    levelSelect.disabled = true;
    btn.textContent = '⏹ 停止';
    btn.classList.add('playing');
    caption.classList.add('show');
    const lvl = levelSelect.value;
    try {
      await playLoop(lvl);
    } catch (err) {
      console.error('随机播放例句出错', err);
    } finally {
      AudioPlayer.cancel();
      TTS.cancel();
      playing = false;
      stopRequested = false;
      levelSelect.disabled = false;
      caption.classList.remove('show');
      btn.textContent = '随机播放例句';
      btn.classList.remove('playing');
    }
  });
})();
</script>

</body>
</html>
