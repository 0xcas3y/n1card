"183": {"analysis": "「〜とする」是一个多功能的表达，可以表示正式决定为…（如公文中宣布决议），也可以表示假设、假定…的情况（如〜とすると／〜としたら），还可以表示将…看作、认定为…，具体意思需根据上下文判断，是N1阅读和写作中极为常见的高频表达。", "mistakes": "❌ 会議は中止をとする（多余助词を） → ✅ 会議は中止とする（とする前面直接接名词/普通形，不需要再加宾格助词を）", "similar": [{"form": "〜と決める", "diff": "「と決める」是更直白、口语的决定说法，「とする」更书面、正式，常用于规则、公告"}, {"form": "〜と仮定する", "diff": "「と仮定する」是更明确、学术化地表示假设，与「とする」表假设的用法意思相同但更强调逻辑推理的语境"}, {"form": "〜とみなす", "diff": "「とみなす」专门表示视为、看作，是「とする」众多含义中的一个具体用法，语气更正式"}], "quiz": [{"q": "本日の会議はこれにて終了____。", "opts": ["A. とします", "B. にとります", "C. としては", "D. とあって"], "ans": "A", "exp": "「終了とします」是正式宣布会议结束的固定说法"}, {"q": "かりに1万円あった____、何に使いますか。", "opts": ["A. とする", "B. として", "C. とあれば", "D. とばかりに"], "ans": "A", "exp": "「あったとする」（とすると/としたら的原形）表示假设拥有一万日元的情况"}, {"q": "この事件は、単なる偶然だった____には無理がある。", "opts": ["A. とする", "B. として", "C. にする", "D. をする"], "ans": "A", "exp": "「偶然だったとする」表示把这件事看作是单纯的偶然，此处指这种看法有不合理之处"}]},
"184": {"analysis": "「〜として〜ない」前接数量最小单位的词（一つ、一人、一日など），后接否定，表示连最小的一个单位都不存在/没有例外，是一种夸张、加强语气的强烈全盘否定，常用于书面语和郑重的表达。", "mistakes": "❌ 誰としても知らない（误加も，混淆其他句型） → ✅ 誰一人として知らない（として前面通常搭配具体的数量词，如誰一人、一つ等，不能只用疑问词誰而不加数量词）", "similar": [{"form": "一つも〜ない", "diff": "「一つも〜ない」是更口语、通俗的说法，意思相同，「一つとして〜ない」更书面、语气更强调无一例外"}, {"form": "〜すら〜ない", "diff": "「すら〜ない」举出一个极端例子强调连…都没有，「として〜ない」是搭配数量词强调没有任何一个，侧重点略有不同"}, {"form": "誰一人〜ない", "diff": "是「〜として〜ない」的常见固定搭配形式之一，誰一人として〜ない表示没有任何一个人…"}], "quiz": [{"q": "この事件について、一人____真実を語ろうとしなかった。", "opts": ["A. として", "B. にとって", "C. にしたら", "D. につき"], "ans": "A", "exp": "「一人として真実を語ろうとしなかった」表示没有一个人愿意说出真相"}, {"q": "彼が来てから、一日____平和な日はなかった。", "opts": ["A. として", "B. にとって", "C. にしても", "D. につけ"], "ans": "A", "exp": "「一日として平和な日はなかった」表示自从他来了之后，没有一天是平静的"}, {"q": "この計画に、一つ____欠点は見当たらない。", "opts": ["A. として", "B. にとって", "C. にしたって", "D. としても"], "ans": "A", "exp": "「一つとして欠点は見当たらない」表示这个计划找不到一个缺点"}]},
"185": {"analysis": "「〜とて」是古典色彩浓厚的书面表达，相当于现代语的〜としても／〜であっても，表示即便是…这种看似特殊、有理由被原谅或例外的情况，结论依然不变，常用于议论文、演讲等正式场合，带有一定的文学性。", "mistakes": "❌ 子供とてもわかる（与も重复混用） → ✅ 子供とてわかる／子供でもわかる（とて本身已含有让步转折的语感，不需要再叠加も，二者选其一即可）", "similar": [{"form": "〜としても", "diff": "「としても」是现代口语中通用的让步表达，「とて」是其更古典、书面的说法，意思相同"}, {"form": "〜であっても", "diff": "「であっても」也是让步转折，语气比「とて」稍微现代、通用一些"}, {"form": "〜こととて", "diff": "「こととて」是因为是…的缘故的原因表达，与表让步的「とて」意思完全不同，注意区分形似的两个语法点"}], "quiz": [{"q": "いくら金持ち____、健康には代えられない。", "opts": ["A. とて", "B. こととて", "C. とばかりに", "D. として"], "ans": "A", "exp": "「金持ちとて」表示即使是有钱人，也无法用金钱换取健康"}, {"q": "親____、子供の全てを理解しているわけではない。", "opts": ["A. とて", "B. こととて", "C. とばかりに", "D. にあって"], "ans": "A", "exp": "「親とて」表示即使身为父母，也不一定完全理解孩子"}, {"q": "後悔した____、もう取り返しはつかない。", "opts": ["A. とて", "B. こととて", "C. とばかりに", "D. にひきかえ"], "ans": "A", "exp": "「後悔したとて」表示即使后悔了，也无法挽回"}]},
"186": {"analysis": "「〜ところだった」接在动词辞書形后（常与危うく／もう少しで等副词搭配），表示事情本来很有可能就要发生了，但实际上最终并没有发生，带有说话人回想起当时惊险场面、心有余悸的语气。", "mistakes": "❌ 電車に乗り遅れたところだった（结果混淆） → ✅ 電車に乗り遅れるところだった（辞書形+ところだった表示差点就要发生但没发生；如果用た形乗り遅れたところだった，则容易被误解为刚刚发生过，意思会混淆，需注意区分辞書形和た形前接ところだ的不同含义）", "similar": [{"form": "〜ところだ", "diff": "Vるところだ表示正要做…，Vたところだ表示刚做完…，都是客观描述时间点，而「ところだった」特指差点发生但没发生的假定性场景"}, {"form": "危うく〜ところだった", "diff": "「危うく」常与「ところだった」搭配，加强千钧一发、好险的语感，是这个句型最典型的固定搭配"}, {"form": "〜そうになった", "diff": "「そうになった」也表示差点就…，与「ところだった」意思非常接近，可互换，「そうになった」略微更口语"}], "quiz": [{"q": "寝坊して、危うく大事な会議に遅れる____。", "opts": ["A. ところだった", "B. ばかりだった", "C. まででした", "D. きりだった"], "ans": "A", "exp": "「遅れるところだった」表示差点就要迟到，但最终没有迟到"}, {"q": "橋が崩れる直前に渡っていて、あと少しで川に落ちる____。", "opts": ["A. ところだった", "B. ことだった", "C. ものだった", "D. わけだった"], "ans": "A", "exp": "「落ちるところだった」表示差一点就掉进河里，实际没有发生"}, {"q": "値段を確認せずに買うところを、店員に言われて気づき、無駄遣いする____。", "opts": ["A. ところだった", "B. ままだった", "C. きりだった", "D. ふうだった"], "ans": "A", "exp": "「無駄遣いするところだった」表示差点就要浪费钱，幸好及时发现"}]},
"187": {"analysis": "「〜とはいうものの」表示承认前面所说的事情（名义上、表面上）确实如此，但实际情况、心理感受却与之存在落差、并非那么理想，常用于承接一个既定事实或普遍看法，再转而说明现实的复杂性或说话人真实的顾虑。", "mistakes": "❌ 高いとはいうものの、買うつもりだ（转折内容矛盾） → 「とはいうものの」后半通常接与前项名义相悖、有所保留或问题尚存的内容；若后半是顺理成章的决定（如虽然贵但还是要买这种坚决语气），语感上不如直接用〜が自然，「とはいうものの」更适合表达虽然如此，但仍有顾虑/问题", "similar": [{"form": "〜とはいえ", "diff": "意思、用法非常接近，几乎可以互换，「とはいえ」略微更简洁、使用频率更高"}, {"form": "〜といっても", "diff": "「といっても」也表示虽说…，但更强调程度、范围其实没那么夸张（比如留学といっても、一週間だけだ），「とはいうものの」更强调现实与名义之间的落差感"}, {"form": "〜ものの", "diff": "「ものの」单独使用也可表转折虽然…但是…，是「とはいうものの」的简化形式，意思相近"}], "quiz": [{"q": "ダイエット中____、つい甘いものを食べてしまう。", "opts": ["A. とはいうものの", "B. としたところで", "C. とあれば", "D. とばかりに"], "ans": "A", "exp": "「ダイエット中とはいうものの」表示虽说在减肥，但还是忍不住吃甜食"}, {"q": "新しい上司は優しい____、仕事には厳しい一面もある。", "opts": ["A. とはいうものの", "B. とばかりに", "C. ともなると", "D. といえども"], "ans": "A", "exp": "「優しいとはいうものの」表示虽说新上司很温和，但工作上也有严格的一面"}, {"q": "資格を取った____、実務経験がなければ就職は難しい。", "opts": ["A. とはいうものの", "B. とあって", "C. とばかりに", "D. ともなく"], "ans": "A", "exp": "「資格を取ったとはいうものの」表示虽说考取了资格证，但没有实务经验找工作依然困难"}]},
"188": {"analysis": "「〜とばかりに」前面接一句话（常带引号）或名词，表示虽然没有真的说出口，但从他的动作、表情能明显看出他内心正是这么想的，用来生动描写人物的言外之意、心理活动，是文学性较强的表达手法。", "mistakes": "❌ 嬉しいとばかりに笑った（直接描述自己心情不适用） → 「とばかりに」通常用于第三人称，通过其外在的动作/表情来侧面暗示其内心想法，而不是直接描述该人物本身的情绪状态，若只是单纯描述某人高兴地笑了，直接用嬉しそうに笑った即可", "similar": [{"form": "〜と言わんばかりに", "diff": "是「とばかりに」的完整原型，意思完全相同，「とばかりに」是其省略后更常用的形式"}, {"form": "まるで〜ように", "diff": "「まるで〜ように」是单纯的比喻就像…一样，「とばかりに」特指仿佛在传达某种没有说出口的言外之意，更具画面感和心理描写色彩"}, {"form": "〜がごとく", "diff": "「がごとく」是如同…一般的古典比喻表达，与「とばかりに」都带有文学性，但「とばかりに」更侧重言外之意的传达"}], "quiz": [{"q": "彼女はこれ以上聞くな____、話題を変えた。", "opts": ["A. とばかりに", "B. といえども", "C. とあって", "D. とすれば"], "ans": "A", "exp": "「聞くなとばかりに」表示她仿佛在说别再问了似的，转移了话题"}, {"q": "犬はまるで散歩に行きたい____、しっぽを振り続けた。", "opts": ["A. とばかりに", "B. ともなると", "C. とあれば", "D. といったら"], "ans": "A", "exp": "「行きたいとばかりに」通过狗摇尾巴的动作暗示它内心的期待"}, {"q": "彼は待ってましたと____、すぐに立ち上がって発言した。", "opts": ["A. ばかりに", "B. いえども", "C. あれば", "D. すれば"], "ans": "A", "exp": "「待ってましたとばかりに」表示他仿佛一直在等待这个时机，立刻站起来发言"}]},
"189": {"analysis": "「〜と引き換えに」表示以某种重大的付出/牺牲作为交换的代价，来获得或实现后项，前接的内容通常是非常珍贵、重要的事物（生命、健康、名誉等），带有强烈的对比和郑重的语感。", "mistakes": "❌ お金と引き換えに商品を渡す（日常商业交易描述过于夸张） → 该表达更适合用于描写重大、有牺牲意味的交换，若只是普通的商品与货款交换，使用「と引き換えに」会显得语感过重，日常场景直接用と交換に更自然", "similar": [{"form": "〜と交換に", "diff": "「と交換に」是更中性、日常的说法，「と引き換えに」语感更正式、更强调付出重大代价"}, {"form": "〜を代償に", "diff": "「を代償に」意思、语感与「と引き換えに」非常接近，都强调付出宝贵的代价，可互换"}, {"form": "〜のかわりに", "diff": "「のかわりに」是更基础、通用的代替表达，不一定含有牺牲、代价的沉重语感"}], "quiz": [{"q": "彼女は自由____、安定した生活を手に入れた。", "opts": ["A. と引き換えに", "B. にひきかえ", "C. をよそに", "D. にかまけて"], "ans": "A", "exp": "「自由と引き換えに」表示以放弃自由为代价换来了稳定的生活"}, {"q": "多くの命____、この技術は発展してきた。", "opts": ["A. と引き換えに", "B. にもまして", "C. をおいて", "D. にかけて"], "ans": "A", "exp": "「多くの命と引き換えに」表示这项技术是以许多生命为代价发展起来的"}, {"q": "彼は名誉____、真実を語ることを選んだ。", "opts": ["A. と引き換えに", "B. にひきかえ", "C. につけ", "D. をものともせず"], "ans": "A", "exp": "「名誉と引き換えに」表示他以牺牲名誉为代价，选择了说出真相"}]},
"190": {"analysis": "「〜とまでは言わないが」用于说话人先提出一个较为极端、程度较高的说法，再用言わないが否定这种极端说法，转而提出一个相对温和、退一步的要求或评价，是一种委婉表达真实想法的方式。", "mistakes": "❌ 天才とまで言わないが（缺少は） → ✅ 天才とまでは言わないが（まで后面通常需要加强调助词は，构成とまでは言わない这一固定搭配，省略は语感会不自然）", "similar": [{"form": "〜とは言わないまでも", "diff": "意思、结构与「とまでは言わないが」几乎相同，是更书面的说法，可互换"}, {"form": "〜ほどではないが", "diff": "「ほどではないが」表示没有达到…的程度，但是…，与「とまでは言わないが」意思接近，都是退一步的评价"}, {"form": "せめて〜くらいは", "diff": "「せめて」常与「とまでは言わないが」搭配使用，进一步提出至少希望…的最低要求"}], "quiz": [{"q": "毎日連絡しろ____、せめて週に一度は電話してほしい。", "opts": ["A. とまでは言わないが", "B. とばかりに", "C. としたところで", "D. といえども"], "ans": "A", "exp": "「毎日連絡しろとまでは言わないが」表示不要求每天联系，但至少希望每周一次"}, {"q": "完璧____、彼の仕事ぶりはなかなかのものだ。", "opts": ["A. とまでは言わないが", "B. とばかりに", "C. にひきかえ", "D. をよそに"], "ans": "A", "exp": "「完璧とまでは言わないが」表示虽不至于说完美，但他的工作表现相当不错"}, {"q": "反対____、あまり賛成はできない。", "opts": ["A. とまでは言わないが", "B. とばかりに", "C. としたことが", "D. とはいえ"], "ans": "A", "exp": "「反対とまでは言わないが」表示虽不至于反对，但也不太能赞成"}]},
"191": {"analysis": "「〜に〜を重ねて」将同一个名词重复两次，中间用に连接，后接を重ねて，表示同一件事情反复多次地累积、进行，强调过程的漫长、反复和不易，常用于描写经过长期努力、多次尝试后取得成果的场合。", "mistakes": "❌ 工夫を工夫に重ねて（语序错误） → ✅ 工夫に工夫を重ねて（固定语序是名词1+に+名词1+を重ねて，助词に和を的位置不能颠倒）", "similar": [{"form": "何度も〜する", "diff": "「何度も」是副词，泛指很多次，「に〜を重ねて」通过名词重复更具体、更强调层层累积的过程感"}, {"form": "〜を繰り返して", "diff": "「を繰り返して」也表示反复，但没有「に〜を重ねて」那种不断累加、层层叠加的递进语感"}, {"form": "〜の上に〜を重ねる", "diff": "「の上に〜を重ねる」是更直白的说法在…之上再叠加…，与「に〜を重ねて」意思相近但结构不同"}], "quiz": [{"q": "研究者たちは実験____実験____、新しい薬を開発した。", "opts": ["A. に／を重ねて", "B. を／に重ねて", "C. と／を重ねて", "D. で／を重ねて"], "ans": "A", "exp": "「実験に実験を重ねて」表示经过反复多次的实验才开发出新药"}, {"q": "彼女は練習____練習____、ついに大会で優勝した。", "opts": ["A. に／を重ねて", "B. と／を重ねて", "C. の／を重ねて", "D. へ／を重ねて"], "ans": "A", "exp": "「練習に練習を重ねて」表示经过反复的练习才在比赛中获胜"}, {"q": "交渉____交渉____、ようやく契約に至った。", "opts": ["A. に／を重ねて", "B. を／に重ねて", "C. で／を重ねて", "D. が／を重ねて"], "ans": "A", "exp": "「交渉に交渉を重ねて」表示经过反复多次的谈判才达成合同"}]},
"192": {"analysis": "「〜ないものか」接在动词ない形后，以反问的形式表达说话人很希望能实现某事，正在积极思考有没有办法做到的强烈愿望，常与何とか／なんとか搭配，语气中带有努力寻求解决方案的积极态度。", "mistakes": "❌ 单纯理解为不可能の确认（误解为纯粹的疑问） → 「ないものか」不是单纯询问是否可能，而是带有很希望能做到、正在积极思考办法的强烈愿望色彩，语气比单纯的〜できないか更积极主动", "similar": [{"form": "〜ないだろうか", "diff": "「ないだろうか」是较为中性的委婉疑问/推测，「ないものか」愿望色彩更浓，更像是自言自语地思索解决办法"}, {"form": "なんとか〜たい", "diff": "「なんとか〜たい」直接表达想办法做到…的愿望，「ないものか」通过反问的形式更委婉地表达同样的愿望"}, {"form": "〜てほしいものだ", "diff": "「てほしいものだ」是对他人或客观情况的期望，「ないものか」更多是说话人自己在思考解决方法时的自问自答"}], "quiz": [{"q": "もっと早く病気を発見でき____と、医師たちは日々研究を続けている。", "opts": ["A. ないものか", "B. ないことか", "C. ないまでか", "D. ないきりか"], "ans": "A", "exp": "「発見できないものか」表达医生们希望能早日发现疾病的强烈愿望"}, {"q": "何とか二人の仲を取り持て____と、友人は頭を悩ませた。", "opts": ["A. ないものか", "B. ないことか", "C. ないだけか", "D. ないほどか"], "ans": "A", "exp": "「取り持てないものか」表达朋友希望能撮合两人关系的心情"}, {"q": "この伝統文化を後世に残せ____と、地元の人々は取り組んでいる。", "opts": ["A. ないものか", "B. ないところか", "C. ないまでか", "D. ないうえか"], "ans": "A", "exp": "「残せないものか」表达当地人希望能将传统文化传承下去的愿望"}]},
"193": {"analysis": "「〜なまでに」接在ナ形容词或表示极端程度的词后，表示到了可以用某个极端的词来形容的程度，用来强调事物某种性质、状态达到了异乎寻常、超出一般水平的地步，语气带有夸张、生动的修辞色彩。", "mistakes": "❌ きれいだなまでに（多余だ） → ✅ きれいなまでに（ナ形容词接续なまでに时，直接用词干+な，不需要再加だ）", "similar": [{"form": "〜ほどに", "diff": "「ほどに」也表示程度，但语感较中性平实，「なまでに」更强调极端、异常的夸张感"}, {"form": "〜くらい", "diff": "「くらい」是最基础通用的程度表达，「なまでに」更书面、更强调修辞上的夸张效果"}, {"form": "異常なほど", "diff": "与「異常なまでに」意思、结构非常接近，「異常なほど」也常用，两者可互换使用"}], "quiz": [{"q": "彼の部屋は病的____、きれいに整理整頓されていた。", "opts": ["A. なまでに", "B. なりに", "C. だけに", "D. ながらに"], "ans": "A", "exp": "「病的なまでに」强调整理得干净到近乎病态的程度"}, {"q": "その静けさは不気味____感じられた。", "opts": ["A. なまでに", "B. なりに", "C. だけに", "D. ゆえに"], "ans": "A", "exp": "「不気味なまでに」强调那种寂静让人感到诡异的程度"}, {"q": "彼女は完璧主義____、細かいミスも許さない。", "opts": ["A. なまでに", "B. なりに", "C. だけあって", "D. とばかりに"], "ans": "A", "exp": "「完璧主義なまでに」强调她追求完美到了极端的程度"}]},
"194": {"analysis": "「〜並み」接在名词后，表示达到了与该事物同等的水平、程度，常用来将某事物与一个具有代表性的参照标准（如季节、专业人士、平均水平等）进行比较，强调已经不逊色于/相当于该标准。", "mistakes": "❌ プロの並み（多余の） → ✅ プロ並み（並み直接接在名词后面，不需要再加助词の）", "similar": [{"form": "〜同様", "diff": "「同様」是更正式书面的同样说法，「並み」更强调达到某种（较高）水平的比较意味"}, {"form": "〜レベル", "diff": "「レベル」是外来语，泛指水平，「並み」更具日语固有的比较、并列语感"}, {"form": "〜に匹敵する", "diff": "「に匹敵する」是更书面正式的说法堪与…匹敌，语气比「並み」更强烈、郑重"}], "quiz": [{"q": "今年の冬は、暖冬とはいえ、例年____の寒さの日もあった。", "opts": ["A. 並み", "B. なり", "C. だけ", "D. きり"], "ans": "A", "exp": "「例年並みの寒さ」表示达到往年同等程度的寒冷"}, {"q": "彼の英語力はネイティブ____だと言われている。", "opts": ["A. 並み", "B. がち", "C. づけ", "D. ずくめ"], "ans": "A", "exp": "「ネイティブ並み」表示英语水平和母语者相当"}, {"q": "この地域の物価は、都心____に高い。", "opts": ["A. 並み", "B. のみ", "C. のごとく", "D. とばかり"], "ans": "A", "exp": "「都心並みに高い」表示这个地区的物价和市中心一样高"}]},
"195": {"analysis": "「何も〜ない」（常以何も〜ことはない／何も〜なくてもいい的形式出现）表示说话人认为没有必要做到前项所说的那种程度，带有安抚、劝说对方不要反应过度或过于极端的语气。", "mistakes": "❌ 何もしなくてもいい（与完全不做混淆） → 需注意「何も〜ない」在此句型中是没必要特意做到某种程度，而不是字面上的什么都不用做，容易与何もしなくてもいい（什么都不用做）这种字面意思混淆，需结合具体语境判断", "similar": [{"form": "わざわざ〜ことはない", "diff": "「わざわざ」强调特意、专程，与「何も〜ことはない」意思、用法非常接近，可互换"}, {"form": "〜には及ばない", "diff": "「には及ばない」是更书面的说法，表示不需要做到…的程度，与「何も〜ない」语气相近但更正式"}, {"form": "そんなに〜なくても", "diff": "「そんなに」直接修饰程度那么…，常与「何も」搭配一起使用，加强没必要到那种程度的语气"}], "quiz": [{"q": "____そこまで心配することはないよ、大丈夫だから。", "opts": ["A. 何も", "B. いかにも", "C. さも", "D. あたかも"], "ans": "A", "exp": "「何も心配することはない」表示没必要担心到那种程度"}, {"q": "____無理して参加しなくてもいいんですよ。", "opts": ["A. 何も", "B. まさに", "C. いかにも", "D. さぞ"], "ans": "A", "exp": "「何も無理して参加しなくてもいい」表示没必要勉强自己参加"}, {"q": "____そんなに怒鳴らなくても、話せばわかるでしょう。", "opts": ["A. 何も", "B. どうも", "C. いかにも", "D. さも"], "ans": "A", "exp": "「何もそんなに怒鳴らなくても」表示没必要那样大声吼叫"}]},
"196": {"analysis": "「〜なんてもんじゃない」是非常口语化的强调表达，用于否定一个相对温和的形容词/说法，暗示实际程度远远超过那个词所能表达的范围，常用于日常对话中生动地强调事态的严重性或夸张程度。", "mistakes": "❌ 正式场合、书面语中使用（语域不当） → 该表达是极度口语化的表达方式，不适用于正式的书面报告、商务邮件等场合，正式语境应使用〜どころではない、〜にとどまらない等更书面的表达", "similar": [{"form": "〜どころではない", "diff": "「どころではない」也表示远不止于此，但更侧重根本没有那种从容的心情/条件，「なんてもんじゃない」更单纯强调程度远超字面"}, {"form": "〜なんてレベルじゃない", "diff": "是「なんてもんじゃない」的现代口语变体，意思完全相同，使用外来语レベル更显年轻化"}, {"form": "〜の域を超えている", "diff": "「の域を超えている」是更书面的说法，表示已经超出了…的范畴，与「なんてもんじゃない」意思接近但语域不同"}], "quiz": [{"q": "今回のプロジェクトの大変さは、忙しい____よ。", "opts": ["A. なんてもんじゃない", "B. どころか", "C. のみならず", "D. にひきかえ"], "ans": "A", "exp": "「忙しいなんてもんじゃない」强调这次项目的辛苦程度远超忙这个字"}, {"q": "昨日の地震の揺れは、怖い____、本当に死ぬかと思った。", "opts": ["A. なんてもんじゃなくて", "B. どころではなくて", "C. にたえなくて", "D. にかたくなくて"], "ans": "A", "exp": "「怖いなんてもんじゃなくて」强调那种恐惧程度已经无法用怖い来形容"}, {"q": "彼の料理の腕前は、上手____、まるでプロだ。", "opts": ["A. なんてもんじゃなくて", "B. でしかなくて", "C. にたえなくて", "D. にすぎなくて"], "ans": "A", "exp": "「上手なんてもんじゃなくて」强调他的厨艺水平远超上手（擅长）这个程度"}]},
"197": {"analysis": "「〜に値する」接在名词或动词辞書形后，表示具备足够的价值，值得给予后面所说的评价（称赞、尊敬、信赖等），是书面正式的评价性表达，常见于评论、报道、议论文中。", "mistakes": "❌ 信頼に値できる（误用可能形） → ✅ 信頼に値する（値する本身是动词，表示值得，不需要再变成可能形，直接以辞書形或ます形结句即可）", "similar": [{"form": "〜がいがある", "diff": "「がいがある」侧重做这件事本身有意义、值得投入，「に値する」更侧重该事物本身具备被这样评价的资格/价值"}, {"form": "〜に足る", "diff": "「に足る」意思、用法与「に値する」非常接近，都表示足以…、值得…，语气都较为书面正式，可互换"}, {"form": "〜するだけの価値がある", "diff": "「するだけの価値がある」是更直白具体的说法，「に値する」更简洁、书面化"}], "quiz": [{"q": "彼女のボランティア活動は、多くの人々の尊敬____。", "opts": ["A. に値する", "B. にたえる", "C. にかたい", "D. にたる"], "ans": "A", "exp": "「尊敬に値する」表示她的志愿活动值得众人的尊敬"}, {"q": "この事件は、詳しく調査する____ものだ。", "opts": ["A. に値する", "B. にすぎない", "C. でしかない", "D. にほかならない"], "ans": "A", "exp": "「調査するに値する」表示这个事件值得详细调查"}, {"q": "彼の発言は、一考____内容を含んでいる。", "opts": ["A. に値する", "B. にたえない", "C. にかたくない", "D. にすぎない"], "ans": "A", "exp": "「一考に値する」表示他的发言包含值得深思的内容"}]},
"198": {"analysis": "「〜にあたらない」接在驚く、責める、悲観する、称賛する等表示情绪反应或评价的动词辞書形后面，表示没有必要做出这样的反应/评价，事情没有严重到那个地步，是书面正式的表达，常见于评论文章中冷静地劝阻过度反应。", "mistakes": "❌ 驚くのにあたらない（多余助词の） → ✅ 驚くにあたらない（にあたらない直接接在动词辞書形后面，中间不需要加の）", "similar": [{"form": "〜には及ばない", "diff": "「には及ばない」也表示没必要…，但更侧重没必要做到那个程度/做那件事，「にあたらない」更侧重不值得产生某种情绪反应"}, {"form": "〜ほどのことではない", "diff": "「ほどのことではない」是更直白的说法没到那种地步，「にあたらない」更书面、正式"}, {"form": "〜までもない", "diff": "「までもない」表示没必要特意做…，与「にあたらない」意思接近，但「までもない」更常搭配言う、説明する等动词"}], "quiz": [{"q": "予想通りの結果なので、特に____。", "opts": ["A. 驚くにあたらない", "B. 驚くにたえない", "C. 驚くにかたくない", "D. 驚くにすぎない"], "ans": "A", "exp": "「驚くにあたらない」表示这是预料之中的结果，不值得惊讶"}, {"q": "彼のこの程度の失敗は、まだ____。", "opts": ["A. 責めるにあたらない", "B. 責めるにたえない", "C. 責めるにかたくない", "D. 責めるにすぎない"], "ans": "A", "exp": "「責めるにあたらない」表示这种程度的失败还不值得责备"}, {"q": "これくらいの成果で満足する____。", "opts": ["A. にはあたらない", "B. にはたえない", "C. にはかたくない", "D. にはすぎない"], "ans": "A", "exp": "「満足するにはあたらない」表示不值得为这点成果而满足"}]},
"199": {"analysis": "「〜に至って（は）」表示事情发展到了前项所描述的（通常是相当严重、极端的）阶段，说话人才终于…（意识到/采取行动），强调为时已晚或事态已发展到不可忽视的地步的语感，是书面正式的表达；与表示到达、涵盖范围的〜に至るまで是不同的语法点，容易混淆需注意区分。", "mistakes": "❌ 混淆に至って与に至るまで（两者意思不同） → 「に至って」强调事态发展到某个（严重）阶段才…，「に至るまで」强调范围一直延伸到…，例如北海道から沖縄に至るまで（从北海道到冲绳，范围）与事態がここに至って（事态到了这个地步，阶段）用法完全不同", "similar": [{"form": "〜に至るまで", "diff": "「に至るまで」强调范围、程度一直延伸到…，「に至って」强调事情发展到某个阶段才产生后续反应，二者形似但用法不同"}, {"form": "〜てはじめて", "diff": "「てはじめて」表示直到…才（第一次意识到/做到），与「に至って」在为时已晚、终于的语感上相近"}, {"form": "ここに及んで", "diff": "「ここに及んで」意思、用法与「ここに至って」非常接近，都表示事到如今，可互换"}], "quiz": [{"q": "会社が倒産する____、社長はようやく自分の経営の甘さに気づいた。", "opts": ["A. に至って", "B. に至るまで", "C. にあって", "D. にして"], "ans": "A", "exp": "「倒産するに至って」表示事态发展到公司破产这一严重阶段才有所醒悟"}, {"q": "問題がここ____、これ以上先送りにはできない。", "opts": ["A. に至っては", "B. に至るまでは", "C. にとっては", "D. にしては"], "ans": "A", "exp": "「ここに至っては」表示事情到了这个地步，不能再拖延了"}, {"q": "被害者が100人を超える____、政府もようやく対策に乗り出した。", "opts": ["A. に至って", "B. に至るまで", "C. にひきかえ", "D. にもまして"], "ans": "A", "exp": "「100人を超えるに至って」表示受害者人数达到这一严重程度，政府才开始采取对策"}]},
"200": {"analysis": "「〜に負うところが大きい」中負う意为依靠、承担，整体表示某个结果的实现，很大一部分是依赖/归功于前项这个因素，是书面正式的表达，常用于分析原因、总结成因的议论文、报道中，语气客观、有分寸。", "mistakes": "❌ 彼の努力に負うところが小さい（逻辑矛盾） → 该表达通常与大きい搭配，强调归功程度很大，若要表达归功程度很小，逻辑上依然可以说小さい，但更常见、更自然的说法通常是正面强调大きい这一方向，需注意语境是否符合此表达的常见用法", "similar": [{"form": "〜のおかげで", "diff": "「のおかげで」是更日常口语的多亏了…，「に負うところが大きい」更书面、客观、常用于分析性文章"}, {"form": "〜による", "diff": "「による」是中性客观地说明由于…，没有「に負うところが大きい」那种很大程度上依赖的比例强调"}, {"form": "〜のたまものだ", "diff": "「のたまものだ」是…的结晶/成果的书面表达，带有更强烈的感恩、赞美色彩，与「に負うところが大きい」的客观分析语气不同"}], "quiz": [{"q": "この作品の完成度の高さは、スタッフたちの情熱____。", "opts": ["A. に負うところが大きい", "B. をよそにしている", "C. にかまけている", "D. をものともしない"], "ans": "A", "exp": "「情熱に負うところが大きい」表示作品的高完成度很大程度上归功于工作人员的热情"}, {"q": "現代医学の発展は、多くの研究者の努力____。", "opts": ["A. に負うところが大きい", "B. にひきかえている", "C. をおいてない", "D. にかまけている"], "ans": "A", "exp": "「努力に負うところが大きい」表示现代医学的发展很大程度上依靠众多研究者的努力"}, {"q": "このチームの強さは、監督の的確な采配____と言えるだろう。", "opts": ["A. に負うところが大きい", "B. をよそにする", "C. にかまける", "D. をものともしない"], "ans": "A", "exp": "「采配に負うところが大きい」表示这支队伍的强大很大程度上归功于教练精准的调度"}]},
"201": {"analysis": "「〜におかれましては」是助词は最高敬意等级的敬语表达，用于郑重地提及对方（多为身份尊贵的个人或组织），常出现在书信、贺词、演讲的开头问候语中，日常口语中几乎不使用。", "mistakes": "❌ 私におかれましては（用于自己不恰当） → ✅ 先生におかれましては（におかれましては是尊敬语，只能用于提及对方或第三方尊敬的人物，绝对不能用于说话人自己）", "similar": [{"form": "〜は", "diff": "「は」是最基础、中性的主题助词，「におかれましては」是其最高敬语等级的替换形式，仅用于郑重场合"}, {"form": "〜さんは", "diff": "日常口语中直接用〜さんは提及某人即可，「におかれましては」专用于书面郑重的敬语场合"}, {"form": "ご健勝のことと", "diff": "常与「におかれましては」搭配出现在书信开头的固定问候套语中，一起构成完整的郑重问候句"}], "quiz": [{"q": "時下ますますご清栄のこととお慶び申し上げます。皆様____、いかがお過ごしでしょうか。", "opts": ["A. におかれましては", "B. にとりましては", "C. につきましては", "D. にしたがっては"], "ans": "A", "exp": "「皆様におかれましては」是书信开头郑重问候对方的敬语固定句式"}, {"q": "会長____、格別のご配慮を賜り、厚く御礼申し上げます。", "opts": ["A. におかれましては", "B. によりましては", "C. にとっては", "D. にしては"], "ans": "A", "exp": "「会長におかれましては」是对会长表达郑重敬意的敬语用法"}, {"q": "ご遺族の皆様____、心よりお悔やみ申し上げます。", "opts": ["A. におかれましては", "B. にたいしては", "C. につきましては", "D. にわたっては"], "ans": "A", "exp": "「ご遺族の皆様におかれましては」是郑重表达哀悼之意时的敬语用法"}]},
"202": {"analysis": "「〜には及ばない」有两种常见用法：一是接在动词辞書形后，表示没有必要做到这个地步（相当于する必要はない）；二是接在名词后，表示比不上、达不到…的水平（相当于ほどではない）。两种意思需要根据前接词性和语境来判断，是N1中容易混淆的多义语法点。", "mistakes": "❌ 混淆两种含义（不辨语境） → 需结合语境判断具体含义：如果前面是动作性的动词（来る、心配する等），通常是没必要的意思；如果前面是比较对象的名词（実力、彼など），则是比不上的意思", "similar": [{"form": "〜までもない", "diff": "「までもない」专门表示没必要特意做…，与「には及ばない」表示没必要的用法意思相近"}, {"form": "〜には敵わない", "diff": "「には敵わない」专门表示比不上、敌不过，是「には及ばない」表比较劣势这一用法的近义词"}, {"form": "〜にあたらない", "diff": "「にあたらない」表示不值得（产生某种情绪反应），与表没必要的「には及ばない」用法接近但侧重点略有不同"}], "quiz": [{"q": "この程度のことで、わざわざ謝る____よ。", "opts": ["A. には及ばない", "B. には敵わない", "C. にはあたる", "D. にはたえる"], "ans": "A", "exp": "「謝るには及ばない」表示没必要特意道歉，此处是没必要的意思"}, {"q": "彼女の料理の腕前は、プロの料理人____と言われている。", "opts": ["A. には及ばないまでも", "B. にはあたらないまでも", "C. にはたえないまでも", "D. にはかねないまでも"], "ans": "A", "exp": "「プロには及ばないまでも」表示虽然比不上专业厨师，但…此处是比不上的意思"}, {"q": "お気遣い____、私は大丈夫ですので。", "opts": ["A. には及びません", "B. にはあたりません", "C. にはたえません", "D. にはかねません"], "ans": "A", "exp": "「お気遣いには及びません」是礼貌地表示不必费心的固定说法"}]},
"203": {"analysis": "「〜に欠かせない」接在名词后，表示对于该事物、该目的来说，是绝对必要、不可缺少的存在，语气中性客观，常用于说明某物在某个体系或过程中的重要必要性，是N1阅读、写作中常见的高频表达。", "mistakes": "❌ 欠かせないもの（省略に，语义不完整） → ✅ 生活に欠かせないもの（欠かせない通常需要明确对什么而言不可或缺，即前面要接に表示对象，省略后意思会不完整）", "similar": [{"form": "〜になくてはならない", "diff": "「になくてはならない」意思、用法与「に欠かせない」几乎相同，都表示不可或缺，可互换"}, {"form": "〜が不可欠だ", "diff": "「が不可欠だ」是更直接的说法…是不可或缺的，与「に欠かせない」的修饰名词用法在句法结构上略有不同"}, {"form": "〜には必須だ", "diff": "「には必須だ」更强调作为必要条件的必需性，语气略微更正式、书面"}], "quiz": [{"q": "塩は、料理の味付け____調味料だ。", "opts": ["A. に欠かせない", "B. になくもない", "C. にたえない", "D. にかたくない"], "ans": "A", "exp": "「味付けに欠かせない」表示盐是调味不可或缺的调料"}, {"q": "十分な睡眠は、健康維持____要素だ。", "opts": ["A. に欠かせない", "B. になくもない", "C. にすぎない", "D. にかたくない"], "ans": "A", "exp": "「健康維持に欠かせない」表示充足的睡眠是维持健康不可或缺的因素"}, {"q": "コミュニケーション能力は、社会生活を送る上で____スキルだ。", "opts": ["A. に欠かせない", "B. になくもない", "C. にたえない", "D. にひきかえの"], "ans": "A", "exp": "「送る上で欠かせない」表示沟通能力是社会生活中不可或缺的技能"}]},
"204": {"analysis": "「〜にかかったら／〜にかかっては」表示一旦事情落到某个具有特殊才能、手腕的人手中，就会产生出人意料的（通常是正面的）结果，用来赞叹某人本领高强，前接的通常是具有专业技能或特殊能力的人物。", "mistakes": "❌ 普通の人にかかったら（用于普通人不自然） → 该表达通常用于强调具有特殊、高超本领的人，若前接的是普通、平凡的人物，则失去了原本高手一出马的赞叹语感，逻辑上不自然", "similar": [{"form": "〜の腕にかかれば", "diff": "「の腕にかかれば」是更具体形象的说法到了…的手上/本领之下，与「にかかったら」意思、用法基本相同"}, {"form": "〜が担当すれば", "diff": "「が担当すれば」是中性客观的说法如果由…负责的话，没有「にかかったら」那种赞叹高超本领的感情色彩"}, {"form": "〜の手にかかると", "diff": "与「にかかったら」意思相同，是另一种常见的表达形式，强调经由某人之手"}], "quiz": [{"q": "この職人____、どんな古い時計も蘇る。", "opts": ["A. にかかったら", "B. にひきかえ", "C. をよそに", "D. にかまけて"], "ans": "A", "exp": "「この職人にかかったら」表示一旦交到这位工匠手里，任何旧钟表都能修复如新"}, {"q": "あの弁護士____、勝てない裁判はないと言われている。", "opts": ["A. にかかっては", "B. にとっては", "C. にしては", "D. につけては"], "ans": "A", "exp": "「あの弁護士にかかっては」赞叹这位律师的高超本领，没有打不赢的官司"}, {"q": "母____、どんな頑固な汚れも落ちてしまう。", "opts": ["A. にかかったら", "B. にとったら", "C. にしたら", "D. につけたら"], "ans": "A", "exp": "「母にかかったら」表示一旦交给妈妈处理，多顽固的污渍都能去除"}]},
"205": {"analysis": "「〜にかかっている」表示某个重大结果是否能够实现，完全取决于前项这个关键因素，强调该因素的决定性作用，常用于表达成败在此一举的紧迫感，多见于议论文、演讲等强调重要性的场合。", "mistakes": "❌ にかかった（时态误用为过去完成） → ✅ にかかっている（该句型固定使用ている形式表示目前取决于/悬而未决的状态，不用过去形かかった）", "similar": [{"form": "〜次第だ", "diff": "「次第だ」意思、用法与「にかかっている」非常接近，都表示取决于…，「次第だ」更简洁常用，「にかかっている」语气更郑重、强调决定性"}, {"form": "〜によって決まる", "diff": "「によって決まる」是更平实客观的说法由…决定，「にかかっている」更强调命运悬于一线的紧张感"}, {"form": "〜いかんだ", "diff": "「いかんだ」是更书面正式的取决于…表达，与「にかかっている」意思相近，但いかんだ语域更高"}], "quiz": [{"q": "このプロジェクトの成否は、皆さんの協力____。", "opts": ["A. にかかっている", "B. にもとづいている", "C. にそくしている", "D. にてらしている"], "ans": "A", "exp": "「皆さんの協力にかかっている」表示项目的成败取决于大家的合作"}, {"q": "地球の未来は、私たち一人一人の行動____と言っても過言ではない。", "opts": ["A. にかかっている", "B. にもとづいている", "C. にじゅんじている", "D. にのっとっている"], "ans": "A", "exp": "「一人一人の行動にかかっている」强调地球的未来取决于每个人的行动"}, {"q": "合格できるかどうかは、これからの努力____。", "opts": ["A. にかかっている", "B. にしたがっている", "C. にそっている", "D. にわたっている"], "ans": "A", "exp": "「これからの努力にかかっている」表示能否合格取决于今后的努力"}]},
"206": {"analysis": "「〜にかこつけて」表示以前项这件事作为表面上的借口/理由，实际上是为了做别的（通常是私利性、不太正当的）事情，带有明显的批评、揭露虚伪动机的语气，常用于描写他人假公济私、找借口逃避责任等行为。", "mistakes": "❌ 正面评价的场合使用（语义误用） → 「にかこつけて」本身带有负面、批判的语感，不能用于描述正当、值得赞许的行为，如果只是单纯借这个机会做某事（无负面意味），应使用〜を機に等中性表达", "similar": [{"form": "〜を口実に", "diff": "「を口実に」意思、用法与「にかこつけて」非常接近，都表示以…为借口，可互换，语气同样带有负面色彩"}, {"form": "〜にことよせて", "diff": "「にことよせて」是更书面、古典的说法，意思与「にかこつけて」相同，都表示假借某事名义"}, {"form": "〜を機に", "diff": "「を機に」是中性表达以…为契机，没有「にかこつけて」那种假借名义、别有用心的负面批判色彩"}], "quiz": [{"q": "彼は忙しさ____、家族との時間を後回しにしている。", "opts": ["A. にかこつけて", "B. をよそに", "C. にひきかえ", "D. をもって"], "ans": "A", "exp": "「忙しさにかこつけて」批评他以忙碌为借口，忽视了与家人相处的时间"}, {"q": "彼女は健康診断____、会社を休んで買い物に出かけた。", "opts": ["A. にかこつけて", "B. にもまして", "C. をものともせず", "D. につけて"], "ans": "A", "exp": "「健康診断にかこつけて」表示她假借体检的名义请假去购物"}, {"q": "あの政治家は、地域振興____、私腹を肥やしていた。", "opts": ["A. にかこつけて", "B. をよそに", "C. にもまして", "D. にかまけて"], "ans": "A", "exp": "「地域振興にかこつけて」批评那位政治家假借振兴地区之名，中饱私囊"}]},
"207": {"analysis": "「〜にしくはない」中しく是古语动词，意为匹敌、比得上，整体表示没有什么能比得上前项，前项是最好的选择，是非常古典、文言色彩浓厚的表达，现代日语中使用频率不高，但在成语、谚语（如三十六計逃げるにしかず）和正式文章中仍可见到。", "mistakes": "❌ 日常会話で頻繁に使う（语域不当） → 该表达文言色彩极重，属于书面语中的高级词汇，日常口语中几乎不使用，过度使用会显得矫揉造作，正式写作、引用谚语时使用更自然", "similar": [{"form": "〜に越したことはない", "diff": "意思非常接近，都表示…是最好的，「に越したことはない」是现代日语常用说法，「にしくはない」是更古典的书面表达"}, {"form": "〜が一番だ", "diff": "「が一番だ」是最基础、口语化的…是最好的表达，与「にしくはない」的古雅书面语感形成鲜明对比"}, {"form": "〜に如かず", "diff": "是「にしくはない」的另一种常见写法（如かず为古语否定形），意思完全相同，常见于成语"}], "quiz": [{"q": "百聞は一見____と言うから、実際に現地へ行ってみよう。", "opts": ["A. にしかず", "B. にひきかえ", "C. にかまけて", "D. をよそに"], "ans": "A", "exp": "「百聞は一見にしかず」是著名的谚语，意为百闻不如一见"}, {"q": "困った時は、専門家に相談する____。", "opts": ["A. にしくはない", "B. にかたくない", "C. にたえない", "D. にすぎない"], "ans": "A", "exp": "「相談するにしくはない」表示遇到困难时，最好向专家咨询"}, {"q": "争いを避けるには、冷静に話し合う____。", "opts": ["A. にしくはない", "B. にかたくない", "C. にたえない", "D. にことかかない"], "ans": "A", "exp": "「話し合うにしくはない」表示避免争执，最好是冷静地商谈"}]},
"208": {"analysis": "「〜に越したことはない」表示虽然这是理所当然、显而易见的道理，但依然想强调一下——这样做（或这种状态）是最理想、最保险的，语气比较温和、常识性，常用于给出一些稳妥的建议或提醒。", "mistakes": "❌ に越したことがない（助词误用） → ✅ に越したことはない（固定搭配用は而不是が，こと后面必须接はない，这是约定俗成的固定用法）", "similar": [{"form": "〜にしくはない", "diff": "意思相同，「にしくはない」是更古典书面的说法，「に越したことはない」是现代日语中最常用、最自然的说法"}, {"form": "〜が一番いい", "diff": "「が一番いい」是最直白口语的说法，「に越したことはない」语气更委婉、带有理所当然但仍要强调的分寸感"}, {"form": "〜ほうがいい", "diff": "「ほうがいい」是给出建议的基础句型，语气比「に越したことはない」更直接、更像是主动建议而非陈述常理"}], "quiz": [{"q": "旅行にはいつもトラブルがつきものだから、保険に入っておく____。", "opts": ["A. に越したことはない", "B. にすぎない", "C. にかたくない", "D. にたえない"], "ans": "A", "exp": "「入っておくに越したことはない」表示提前买保险总是最保险的做法"}, {"q": "給料は高い____が、やりがいのある仕事を選びたい。", "opts": ["A. に越したことはない", "B. にすぎない", "C. にかたくない", "D. をものともしない"], "ans": "A", "exp": "「高いに越したことはない」表示工资当然是越高越好，但同时想选有意义的工作"}, {"q": "子供の教育において、褒めて伸ばす____。", "opts": ["A. に越したことはない", "B. にすぎない", "C. にかたくない", "D. をよそにしない"], "ans": "A", "exp": "「伸ばすに越したことはない」表示在孩子教育方面，表扬着培养总是最好的方法"}]},
"209": {"analysis": "「〜に準じて」表示以前项作为标准、基准，按照该标准的规格或原则来处理后项，常用于说明规则、待遇、处理方式的依据，是较为书面、正式的商务/公文用语。", "mistakes": "❌ 準じてで決定する（多余助词で） → ✅ 準じて決定する（準じて本身已是て形，可直接连接后续动词，不需要再加で）", "similar": [{"form": "〜に基づいて", "diff": "「に基づいて」强调以…为根据/依据，侧重逻辑上的依据；「に準じて」更强调比照某个既定标准来对待，侧重待遇、规格上的比照"}, {"form": "〜に沿って", "diff": "「に沿って」表示按照…的方针/路线，与「に準じて」意思相近，但「に沿って」更常用于方针、计划类的遵循"}, {"form": "〜に相当する", "diff": "「に相当する」表示与…相当、对等，是「に準じて」中待遇相当这一具体用法的近义表达"}], "quiz": [{"q": "退職金は、勤続年数____支給される。", "opts": ["A. に準じて", "B. にそくして", "C. にてらして", "D. にのっとって"], "ans": "A", "exp": "「勤続年数に準じて」表示退休金按照工龄这一标准来支付"}, {"q": "この規則は、国の法律____定められている。", "opts": ["A. に準じて", "B. にかまけて", "C. をよそに", "D. にかこつけて"], "ans": "A", "exp": "「国の法律に準じて」表示这项规则是参照国家法律制定的"}, {"q": "非常勤講師も、常勤の教員____待遇を受ける。", "opts": ["A. に準じた", "B. にかたい", "C. にたえた", "D. にすぎた"], "ans": "A", "exp": "「常勤の教員に準じた待遇」表示兼职讲师也能获得与专职教师相当的待遇"}]},
"210": {"analysis": "「〜に照らして」表示将后项的事物与前项某个既定的标准（法律、规则、事实、经验等）相对照，依此来进行判断或评价，语气客观、理性，常用于议论文、法律文书、新闻评论等需要依据客观标准做出判断的场合。", "mistakes": "❌ 法律に照らせば違法（用法可行但注意语体统一） → 「〜に照らして」和「〜に照らせば」都可用，但「〜に照らして」更常直接接续后续判断句，「に照らせば」是假定形式，语感略有不同，正式文章中更常用照らして这种直接接续的形式", "similar": [{"form": "〜に基づいて", "diff": "「に基づいて」强调以…为依据、基础，「に照らして」更强调与某标准对照、比对的动作过程"}, {"form": "〜からすると", "diff": "「からすると」是从…来看的主观视角判断，「に照らして」是更客观地依据某个明确标准进行对照判断"}, {"form": "〜に鑑みて", "diff": "「に鑑みて」表示鉴于…、考虑到…，通常用于总结过去的经验教训作为参考，「に照らして」更侧重与既定标准的直接比对"}], "quiz": [{"q": "彼の発言は、これまでの経緯____、矛盾している。", "opts": ["A. に照らして", "B. にかまけて", "C. をよそに", "D. にかこつけて"], "ans": "A", "exp": "「経緯に照らして」表示对照过去的经过来看，他的发言存在矛盾"}, {"q": "この判決は、憲法____下されたものだ。", "opts": ["A. に照らして", "B. にかたくて", "C. にたえて", "D. にすぎて"], "ans": "A", "exp": "「憲法に照らして」表示这项判决是依据宪法这一标准做出的"}, {"q": "国際基準____、この製品は安全性に問題がある。", "opts": ["A. に照らすと", "B. にかまけると", "C. をよそにすると", "D. にかこつけると"], "ans": "A", "exp": "「国際基準に照らすと」表示对照国际标准来看，这款产品存在安全隐患"}]},
"211": {"analysis": "「〜に則って」表示严格遵循、按照前项所说的规则、法律、传统、准则来行事，语气非常正式、严谨，强调对既定规范的严格遵守，不容许随意变更，常见于法律、公文、仪式相关的正式表达。", "mistakes": "❌ 彼の意見に則って（用于非规范性的个人意见不自然） → 「に則って」通常搭配具有权威性、规范性的事物（法律、規則、伝統、憲法など），不太用于个人的意见、想法这类非规范性内容，那种情况应使用に従って", "similar": [{"form": "〜に従って", "diff": "「に従って」是更通用、范围更广的遵照…表达，可以搭配规则也可以搭配个人指示；「に則って」专门用于遵循具有权威性、规范性的准则"}, {"form": "〜に準じて", "diff": "「に準じて」是比照…标准，允许一定的灵活参照；「に則って」是严格遵守，规范性、约束力更强"}, {"form": "〜にのっとり", "diff": "是「に則って」的另一种常见连用形写法，意思完全相同"}], "quiz": [{"q": "結婚式は、神道の伝統的な儀式____執り行われた。", "opts": ["A. に則って", "B. にかまけて", "C. をよそに", "D. にかこつけて"], "ans": "A", "exp": "「伝統的な儀式に則って」表示婚礼严格按照神道的传统仪式举行"}, {"q": "この会社の運営は、企業理念____行われている。", "opts": ["A. に則って", "B. にひきかえて", "C. をものともせずに", "D. にもまして"], "ans": "A", "exp": "「企業理念に則って」表示公司的运营是遵照企业理念进行的"}, {"q": "選挙は、公正なルール____実施されなければならない。", "opts": ["A. に則って", "B. にかたくて", "C. にたえて", "D. にすぎて"], "ans": "A", "exp": "「公正なルールに則って」表示选举必须严格按照公正的规则实施"}]},
"212": {"analysis": "「〜にとどまらず」表示事态、影响范围并未局限在前项这个较小的范围内，而是进一步扩展到了更广、更大的范围（后项），是书面正式的表达，常用于议论文、新闻报道中描述事物影响力或范围的扩大。", "mistakes": "❌ にとどまらないで（て形误用） → ✅ にとどまらず（にとどまらず本身就是にとどまらない的连用形，作为连接前后分句的接续词使用，不需要额外变化成〜ないで的形式）", "similar": [{"form": "〜だけでなく", "diff": "「だけでなく」是最基础通用的不仅…而且…表达，「にとどまらず」更书面、更强调超出原有范围、进一步扩展的动态感"}, {"form": "〜のみならず", "diff": "「のみならず」意思、语域与「にとどまらず」非常接近，都是书面语的不仅…，可基本互换"}, {"form": "〜を超えて", "diff": "「を超えて」直接表示超越、超出…范围，与「にとどまらず」的核心语义不局限于高度重合"}], "quiz": [{"q": "この技術の応用は、医療分野____、農業や環境保護にも広がっている。", "opts": ["A. にとどまらず", "B. をよそに", "C. にかまけず", "D. にかこつけず"], "ans": "A", "exp": "「医療分野にとどまらず」表示这项技术的应用不仅限于医疗领域，还扩展到了农业和环保"}, {"q": "彼女の人気は、国内____、アジア全域に広がっている。", "opts": ["A. にとどまらず", "B. をものともせず", "C. にかまけず", "D. をおいて"], "ans": "A", "exp": "「国内にとどまらず」表示她的人气不仅限于国内，扩展到了整个亚洲"}, {"q": "この不況の影響は、一部の業界____、経済全体に及ぶだろう。", "opts": ["A. にとどまらず", "B. にひきかえ", "C. をよそに", "D. にかまけて"], "ans": "A", "exp": "「一部の業界にとどまらず」表示这次经济不景气的影响不仅限于部分行业，还会波及整体经济"}]},
"213": {"analysis": "「〜には無理がある」表示某个计划、想法或说法存在难以实现、不合情理的地方，语气较为委婉客观地指出问题所在，常用于分析、评论某个方案或论点的可行性/合理性时使用。", "mistakes": "❌ には無理だ（意思略有不同） → 「には無理だ」更直接断言不可能，「には無理がある」是更委婉地指出存在不合理的部分，语气相对缓和，留有余地", "similar": [{"form": "〜は現実的ではない", "diff": "「は現実的ではない」直接评价不现实，「には無理がある」更侧重逻辑或条件上有问题"}, {"form": "〜は難しい", "diff": "「は難しい」是最基础的困难表达，「には無理がある」更强调存在不合理、行不通的具体原因"}, {"form": "〜には矛盾がある", "diff": "「には矛盾がある」专门指出逻辑上的矛盾之处，是「には無理がある」众多可能原因中的一种"}], "quiz": [{"q": "一人でこの大きなプロジェクトを進める____と思う。", "opts": ["A. には無理がある", "B. にはたえない", "C. にはあたらない", "D. にはおよばない"], "ans": "A", "exp": "「進めるには無理がある」表示一个人推进这个大项目是不现实的，存在困难"}, {"q": "彼の主張____、論理的な矛盾が見られる。", "opts": ["A. には無理があり", "B. にはたえがたく", "C. にはあたらず", "D. にはおよばず"], "ans": "A", "exp": "「主張には無理があり」表示他的主张存在不合理之处，逻辑上有矛盾"}, {"q": "限られた予算でこの規模のイベントを開催する____。", "opts": ["A. には無理がある", "B. にはたえがたい", "C. にはあたらない", "D. にはおよばない"], "ans": "A", "exp": "「開催するには無理がある」表示在有限的预算下举办这种规模的活动很困难"}]},
"214": {"analysis": "「〜につながる」表示前项这件事会引发/关联到后项这个结果，可以用于正面（努力につながる成功）或负面（ミスにつながる事故）的因果或关联关系，是使用范围很广的表达，常见于议论文、新闻报道中分析原因与结果的关系。", "mistakes": "❌ につながった原因（时态与用法混淆） → ✅ につながる原因（につながる通常用现在形描述普遍性的关联/趋势，用过去形につながった则特指某个具体已发生的因果事件，需根据语境区分）", "similar": [{"form": "〜を引き起こす", "diff": "「を引き起こす」是更直接的引发、导致，通常用于负面结果；「につながる」适用范围更广，正负面结果都可以用"}, {"form": "〜の原因になる", "diff": "「の原因になる」明确指出是…的原因，「につながる」更强调关联性、导向性，因果关系相对没那么直接绝对"}, {"form": "〜に結びつく", "diff": "「に結びつく」意思、用法与「につながる」非常接近，都表示关联、导致，两者可基本互换"}], "quiz": [{"q": "定期的な運動は、健康維持____。", "opts": ["A. につながる", "B. にかまける", "C. をよそにする", "D. にかこつける"], "ans": "A", "exp": "「健康維持につながる」表示定期运动有助于维持健康"}, {"q": "環境破壊は、生態系の崩壊____恐れがある。", "opts": ["A. につながる", "B. にひきかえる", "C. をものともしない", "D. をおいてない"], "ans": "A", "exp": "「崩壊につながる」表示环境破坏有可能导致生态系统的崩溃"}, {"q": "日々の小さな積み重ねが、大きな成果____のだ。", "opts": ["A. につながる", "B. にかまける", "C. をよそにする", "D. にかこつける"], "ans": "A", "exp": "「成果につながる」表示日常的小积累会关系到最终取得的巨大成果"}]},
"215": {"analysis": "「〜に忍びない」中忍ぶ意为忍耐、忍受，整体表示因为怜悯、不舍等情感因素，在心理上无法忍心去做某件事，语气非常书面、感性，常用于表达对某人某物深切的怜惜、不舍之情。", "mistakes": "❌ 忍びないことができない（重复否定累赘） → ✅ 忍びない（忍びない本身已经是不忍心（做）的完整否定含义，不需要再叠加できない）", "similar": [{"form": "〜のは可哀想だ", "diff": "「のは可哀想だ」是更直白口语的…很可怜，「に忍びない」是更书面、含蓄地表达于心不忍的情感"}, {"form": "〜に堪えない", "diff": "「に堪えない」也表示无法忍受，但更侧重厌恶、痛苦的负面情绪，「に忍びない」更侧重怜悯、不舍的柔软情感"}, {"form": "〜のを見るに見かねて", "diff": "「見るに見かねて」表示看不下去了（于是采取了行动），与「に忍びない」表达不忍心看的静态情感不同，「見かねて」更强调后续采取的动作"}], "quiz": [{"q": "この思い出の詰まった家を手放すの____忍びない。", "opts": ["A. に", "B. を", "C. が", "D. で"], "ans": "A", "exp": "「手放すのに忍びない」表示不忍心放弃这个充满回忆的家"}, {"q": "苦しんでいる友人を見捨てる____忍びなかった。", "opts": ["A. に", "B. を", "C. が", "D. で"], "ans": "A", "exp": "「見捨てるに忍びなかった」表示不忍心抛弃正在受苦的朋友"}, {"q": "まだ使える物を捨てる____忍びない性格だ。", "opts": ["A. に", "B. を", "C. が", "D. で"], "ans": "A", "exp": "「捨てるに忍びない」表示不忍心丢弃还能用的东西的性格"}]},
"216": {"analysis": "「〜にもまして」表示与前项相比，程度更进一步、更加高涨/严重，常用于比较现在与过去、某人与其他所有人等，强调超越了原本已经很高的基准，是书面正式的比较级表达。", "mistakes": "❌ 誰よりにもまして（多余助词より） → ✅ 誰にもまして（にもまして本身已包含比较的语义，不需要再叠加より）", "similar": [{"form": "〜以上に", "diff": "「以上に」是更直白的超过…，「にもまして」更书面、更强调在原本已经很高的基础上进一步超越"}, {"form": "〜よりも一層", "diff": "「よりも一層」意思相近，是更通俗易懂的说法，「にもまして」是更凝练的书面表达"}, {"form": "いつにもまして", "diff": "「いつにもまして」是「にもまして」最常见的固定搭配之一，意为比以往任何时候都更加…"}], "quiz": [{"q": "彼は今日、いつ____、機嫌が良さそうだ。", "opts": ["A. にもまして", "B. にひきかえ", "C. をよそに", "D. につけて"], "ans": "A", "exp": "「いつにもまして」表示他今天比平时任何时候都更加心情好"}, {"q": "今回の台風は、前回____大きな被害をもたらした。", "opts": ["A. にもまして", "B. にひきかえ", "C. をよそに", "D. につけても"], "ans": "A", "exp": "「前回にもまして」表示这次台风带来的损失比上次更严重"}, {"q": "彼女は他の誰____、この目標の実現に努力している。", "opts": ["A. にもまして", "B. にひきかえ", "C. をよそに", "D. につけても"], "ans": "A", "exp": "「他の誰にもまして」表示她比其他任何人都更加努力实现这个目标"}]},
"217": {"analysis": "「〜のなんのと」（也常见〜だの〜だの的变体）用于口语中，模仿、转述某人反复列举各种理由/不满进行抱怨、找借口的语气，说话人通常带有一丝无奈或不满的评价态度，语域非常随意口语化。", "mistakes": "❌ 正式场合、书面语中使用（语域不当） → 该表达属于非常随意的口语表达，常带有轻微的嘲讽或不满语气，完全不适用于正式的书面文章或礼貌场合", "similar": [{"form": "〜だの〜だの", "diff": "意思、用法与「のなんのと」非常接近，都表示又是…又是…地列举抱怨，两者可互换，都很口语"}, {"form": "〜とか〜とか言って", "diff": "「とか〜とか言って」也是口语中转述抱怨、借口的说法，语气比「のなんのと」稍微缓和一些"}, {"form": "なんのかんの", "diff": "「なんのかんの」是这样那样、种种的口语说法，常单独使用（なんのかんの言って＝说来说去），与「のなんのと」词源相关，语感类似"}], "quiz": [{"q": "弟は宿題が多い____文句を言いながら、結局最後にはやっている。", "opts": ["A. のなんのと", "B. につけ", "C. とばかりに", "D. ものを"], "ans": "A", "exp": "「多いのなんのと」表示弟弟一边抱怨作业多之类的，一边最终还是做了"}, {"q": "彼女は服が似合わない____言って、鏡の前でずっと悩んでいる。", "opts": ["A. のなんのと", "B. につき", "C. とはいえ", "D. ものを"], "ans": "A", "exp": "「似合わないのなんのと」表示她一直在抱怨衣服不合适之类的"}, {"q": "子供は野菜が嫌い____言って、食べようとしない。", "opts": ["A. のなんのと", "B. につけても", "C. とすれば", "D. ばかりに"], "ans": "A", "exp": "「嫌いのなんのと」表示孩子说着讨厌蔬菜之类的话，不肯吃"}]},
"218": {"analysis": "「〜ばこそ」用假定形ば加强调助词こそ构成，表示正是因为前项这个原因，而不是别的原因，强烈地强调该原因的唯一性和真实性，常用于纠正对方的误解，说明我这样做绝非无情，正是出于这个原因，语气郑重、书面。", "mistakes": "❌ 忙しければこそ、休みたい（因果关系不成立） → 「ばこそ」前后逻辑必须紧密：前项是真正促成后项（通常是积极行为或郑重态度）的原因，若前后逻辑关系薄弱或矛盾，使用会显得不自然，需确保前因后果的强逻辑关联", "similar": [{"form": "〜からこそ", "diff": "意思、用法与「ばこそ」非常接近，「からこそ」是更常用、通用的说法，「ばこそ」更书面、更强调唯一性和郑重感"}, {"form": "〜てこそ", "diff": "「てこそ」表示只有做了…才能…，强调必要条件，与「ばこそ」强调原因唯一性的角度不同"}, {"form": "まさに〜からだ", "diff": "「まさに〜からだ」是更直白的说法正是因为…，与「ばこそ」的强调语感相近但更口语化"}], "quiz": [{"q": "厳しい練習に耐えてきた____、今日の栄光がある。", "opts": ["A. ばこそ", "B. からには", "C. こととて", "D. とばかりに"], "ans": "A", "exp": "「耐えてきたばこそ」强调正是因为忍受了严格的训练，才有了今天的荣耀"}, {"q": "親____、子供の将来を真剣に考えるのだ。", "opts": ["A. であればこそ", "B. であるからには", "C. であることとて", "D. であるとばかりに"], "ans": "A", "exp": "「親であればこそ」强调正因为身为父母，才会认真考虑孩子的未来"}, {"q": "苦しい時期があった____、今の幸せがより一層感じられる。", "opts": ["A. ばこそ", "B. からには", "C. こととて", "D. とばかりに"], "ans": "A", "exp": "「あったばこそ」强调正是因为经历过艰难的时期，才更能感受到现在的幸福"}]},
"219": {"analysis": "「〜はさておいて」表示暂时把前项这个话题放到一边不谈，先处理/谈论更重要或更紧急的事情，常用于转换话题、把控谈话节奏的场合，语气自然、实用，口语和书面语中都可使用。", "mistakes": "❌ 冗談さておいて（缺少は） → ✅ 冗談はさておいて（さておいて前面通常需要加提示助词は，突出这个话题先放一边的对比语感）", "similar": [{"form": "〜は置いといて", "diff": "「は置いといて」是更口语随意的说法，意思与「はさておいて」相同，是は置いておいて的口语音变形式"}, {"form": "それはそれとして", "diff": "「それはそれとして」是独立的接续词短语，意思相近那是那样说，不过…，也用于转换话题"}, {"form": "それより", "diff": "「それより」是更简单直接的转折比起那个，没有「はさておいて」那种暂且搁置的委婉语感"}], "quiz": [{"q": "今日の天気____、明日の予定について話しましょう。", "opts": ["A. はさておいて", "B. につけては", "C. とばかりに", "D. をよそに"], "ans": "A", "exp": "「天気はさておいて」表示今天的天气先不谈，来说说明天的安排"}, {"q": "細かい数字____、全体の方向性から確認していきたい。", "opts": ["A. はさておいて", "B. につけては", "C. とはいえ", "D. をものともせず"], "ans": "A", "exp": "「数字はさておいて」表示细节数字先放一边，先确认整体方向"}, {"q": "それ____、あなたは今夜どこに泊まるつもりですか。", "opts": ["A. はさておき", "B. につけ", "C. とはいえ", "D. をよそに"], "ans": "A", "exp": "「それはさておき」表示那件事先放一边，转而问对方今晚住哪"}]},
"220": {"analysis": "「〜はしない／〜もしない」在动词ます形后加助词は／も再接しない，通过强调助词加强否定的语气，表示绝对不会做…的坚定意志或断言，比单纯的动词否定形（〜ない）语气更强烈、更郑重。", "mistakes": "❌ 行くはしない（应变为ます形再接） → ✅ 行きはしない（はしない前面必须接动词的ます形（去masu），而不是辞書形，注意接续形式）", "similar": [{"form": "〜ない（普通否定）", "diff": "「はしない」是ない加强语气的版本，通过插入助词は/も使否定更加坚决、郑重"}, {"form": "〜ものか", "diff": "「ものか」是反问形式表达强烈的绝不意志，语气比「はしない」更激烈、更带情绪色彩"}, {"form": "決して〜ない", "diff": "「決して〜ない」用副词決して加强否定语气，与「はしない」的加强方式（用助词）不同，但语义强度相近"}], "quiz": [{"q": "どんなに辛くても、彼女は涙を見せ____。", "opts": ["A. はしない", "B. はできない", "C. はならない", "D. はかまわない"], "ans": "A", "exp": "「見せはしない」表示无论多难过，她都绝不会流露出眼泪，语气坚定"}, {"q": "私は自分の信念を、決して曲げ____。", "opts": ["A. はしない", "B. はできない", "C. はならない", "D. はかまわない"], "ans": "A", "exp": "「曲げはしない」表示绝不会改变自己的信念"}, {"q": "彼はお金のために、友人を裏切り____人間だ。", "opts": ["A. はしない", "B. はできない", "C. はならない", "D. はかまわない"], "ans": "A", "exp": "「裏切りはしない」表示他是绝不会为了钱而背叛朋友的人"}]},
"221": {"analysis": "「〜はそっちのけで」表示把本应该做、本应该重视的前项事情完全搁置不管，一门心思投入到其他事情中，带有说话人对这种行为的批评、不满语气，常用于描写不负责任、本末倒置的行为。", "mistakes": "❌ 仕事のそっちのけで（多余助词の） → ✅ 仕事はそっちのけで（そっちのけ前面直接用は提示对比对象，不需要加の）", "similar": [{"form": "〜をほったらかしにして", "diff": "「をほったらかしにして」是更直白的口语说法放着不管，「はそっちのけで」更生动形象，带有完全抛在脑后的画面感"}, {"form": "〜を差し置いて", "diff": "「を差し置いて」表示跳过、无视本应优先的事物（或人），语感与「はそっちのけで」相近，都带有本末倒置的批评意味"}, {"form": "〜にかまけて", "diff": "「にかまけて」表示只顾着…而忽略了其他，与「はそっちのけで」意思接近，但「はそっちのけで」更强调被忽略的那件事，「にかまけて」更强调沉迷的那件事"}], "quiz": [{"q": "彼女は家事____、趣味の絵画に没頭している。", "opts": ["A. はそっちのけで", "B. にかこつけて", "C. をよそにして", "D. にひきかえて"], "ans": "A", "exp": "「家事はそっちのけで」表示她把家务丢在一边，专心画画"}, {"q": "選手たちは試合____、応援団の演出に見入っていた。", "opts": ["A. はそっちのけで", "B. にかこつけて", "C. をものともせず", "D. にもまして"], "ans": "A", "exp": "「試合はそっちのけで」表示选手们把比赛抛在脑后，看入迷了应援团的表演"}, {"q": "あの政治家は国民の生活____、自分の利益ばかり追求している。", "opts": ["A. はそっちのけで", "B. にかまけて", "C. をものともせず", "D. にもまして"], "ans": "A", "exp": "「国民の生活はそっちのけで」批评那位政治家把国民生活抛在脑后，只顾追求自身利益"}]},
"222": {"analysis": "「〜ばそれまでだ」表示如果发生了前项这种情况，那么之前所做的一切努力、积累都将毫无意义、彻底完结，带有一种警示、感叹一切都可能功亏一篑的语气，常用于强调某个条件的关键性和不可逆性。", "mistakes": "❌ ばそれまでのことだ（意思略微不同，注意区别） → 「ばそれまでのことだ」有时也用于表达如果发生了…，那也就那样了（无可奈何、听天由命）的语气，与「ばそれまでだ」核心意思相近，但需注意具体语境中的细微差异", "similar": [{"form": "〜ても無駄だ", "diff": "「ても無駄だ」直接说做了也没用，「ばそれまでだ」更强调一旦发生某个（通常是不好的）条件，之前的一切都将失去意义的假定性和终结感"}, {"form": "〜たら台無しだ", "diff": "「たら台無しだ」意思、语气与「ばそれまでだ」非常接近，都表示一旦…就全毁了，可互换"}, {"form": "〜きりで終わる", "diff": "「きりで終わる」表示仅此一次就结束了，与「ばそれまでだ」强调一旦发生就万事皆休的语感有所不同"}], "quiz": [{"q": "どんなに優れた計画でも、実行に移さなけれ____。", "opts": ["A. ばそれまでだ", "B. ばこそだ", "C. ばのことだ", "D. ばまでのことだ"], "ans": "A", "exp": "「移さなければそれまでだ」表示再好的计划不付诸实践也是白费"}, {"q": "この機会を逃せ____、二度とチャンスは来ないだろう。", "opts": ["A. ばそれまでだ", "B. ばこそだ", "C. ばのことだ", "D. ばまでのことだ"], "ans": "A", "exp": "「逃せばそれまでだ」表示一旦错过这次机会，就再也没有下次了"}, {"q": "いくら高価な機械でも、壊れ____。", "opts": ["A. ればそれまでだ", "B. ればこそだ", "C. ればのことだ", "D. ればまでのことだ"], "ans": "A", "exp": "「壊れればそれまでだ」表示再贵重的机器，一旦坏了就没用了"}]},
"223": {"analysis": "「〜ば〜だけ／〜ば〜ほど」将同一个动词分别以ば形和辞書形（或ます形）重复出现，表示随着前项程度的增加，后项也相应地发生变化，是表达正比例关系最典型的N3-N2基础句型，在N1阅读中常与更复杂的从句结构结合出现。", "mistakes": "❌ 読むば読むほど（应改为读め） → ✅ 読めば読むほど（前半部分必须变为假定形読め+ば，不能直接用辞書形読む+ば）", "similar": [{"form": "〜につれて", "diff": "「につれて」表示随着…，强调两件事物同步变化的趋势，与「ば〜ほど」意思相近但结构不同（につれて不需要重复同一动词）"}, {"form": "〜に伴って", "diff": "「に伴って」是更书面的伴随…而，通常接名词，与「ば〜ほど」重复动词的结构不同"}, {"form": "〜ほど〜はない", "diff": "「ほど〜はない」是没有比…更…的最高级句型，与表比例变化的「ば〜ほど」是完全不同的语法点，注意区分形似的ほど"}], "quiz": [{"q": "このワインは、時間が経て____経つほど、味わいが深くなる。", "opts": ["A. ば", "B. たら", "C. なら", "D. と"], "ans": "A", "exp": "「経てば経つほど」是固定的ば〜ほど结构，前半用假定形経て(ば)"}, {"q": "給料が高けれ____高いほど、責任も重くなる。", "opts": ["A. ば", "B. たら", "C. なら", "D. と"], "ans": "A", "exp": "「高ければ高いほど」是イ形容词的ば〜ほど结构"}, {"q": "この問題は考えれ____考えるほど、複雑に思えてくる。", "opts": ["A. ば", "B. たら", "C. なら", "D. と"], "ans": "A", "exp": "「考えれば考えるほど」表示越想这个问题越觉得复杂"}]},
"224": {"analysis": "「〜羽目になる」表示由于自己的失误、或某种意外的情况，最终陷入了一个自己本不希望、不情愿的处境，带有一种自嘲、无奈或懊悔的语气，通常前接的结果都是消极、麻烦的境况。", "mistakes": "❌ 昇進する羽目になった（用于正面结果不自然） → 该表达专用于描述陷入不希望、不情愿的负面处境，若结果是正面、值得高兴的事（如升职），使用「羽目になる」会显得逻辑矛盾，应改用ことになった等中性表达", "similar": [{"form": "〜ことになる", "diff": "「ことになる」是中性客观的结果变成…，没有「羽目になる」那种陷入意外坏处境的负面、无奈语感"}, {"form": "〜はめに陥る", "diff": "「はめに陥る」与「羽目になる」意思、用法完全相同，是另一种常见写法"}, {"form": "〜ざるを得なくなる", "diff": "「ざるを得なくなる」强调被迫不得不做…，侧重不得已，「羽目になる」更侧重意外陷入某种不利处境的结果本身"}], "quiz": [{"q": "電車を乗り間違えて、遠回りをする____。", "opts": ["A. 羽目になった", "B. きらいがあった", "C. ふしがあった", "D. しまつだった"], "ans": "A", "exp": "「遠回りをする羽目になった」表示因坐错车，落得绕远路的下场"}, {"q": "彼の代わりに、急な出張を引き受ける____。", "opts": ["A. 羽目になった", "B. きらいがあった", "C. ふしがあった", "D. までのことだった"], "ans": "A", "exp": "「引き受ける羽目になった」表示意外地落得替他出差的处境"}, {"q": "口約束を信じたばかりに、大損をする____。", "opts": ["A. 羽目になった", "B. きらいがあった", "C. ところだった", "D. までだった"], "ans": "A", "exp": "「大損をする羽目になった」表示因为轻信口头承诺，落得蒙受巨大损失的下场"}]},
"225": {"analysis": "「〜べくして」通常以Vるべくして＋同一動詞的重复形式出现，表示这件事的发生并非偶然，而是由种种必然的原因导致，是命中注定、理所应当会发生的结果，语气带有事后总结、分析因果必然性的书面色彩。", "mistakes": "❌ 起こるべくして防げなかった（动词不一致） → ✅ 起こるべくして起こった（べくして前后必须使用同一个动词，用来强调结果与其发生的必然性完全一致，前后动词不同则不符合此句型的固定用法）", "similar": [{"form": "〜べく", "diff": "「べく」单独使用表示为了…的目的，「べくして」是べく叠加同一动词构成的固定强调句型，表必然性，两者意思、用法均不同"}, {"form": "当然の結果として", "diff": "「当然の結果として」是更直白的说法作为理所当然的结果，与「べくして」的必然性强调相近，但缺乏「べくして」那种命运、宿命般的书面文学色彩"}, {"form": "〜のは必然だ", "diff": "「のは必然だ」直接判断…是必然的，语气更平实客观，「べくして」更强调事后回顾发现这是命中注定的感慨语气"}], "quiz": [{"q": "長年の準備と努力があったからこそ、彼の優勝は勝つ____勝ったのだ。", "opts": ["A. べくして", "B. べからず", "C. べからざる", "D. べからずして"], "ans": "A", "exp": "「勝つべくして勝った」表示他的胜利是必然的结果，并非偶然"}, {"q": "あの会社の倒産は、起こる____起こった、避けられない結末だった。", "opts": ["A. べくして", "B. べからず", "C. べからざる", "D. までもなく"], "ans": "A", "exp": "「起こるべくして起こった」表示公司的倒闭是必然会发生的结局"}, {"q": "彼が信頼を得たのは、信頼される____される結果だと言えるだろう。", "opts": ["A. べくして", "B. べからず", "C. までもなく", "D. べからざる"], "ans": "A", "exp": "「信頼されるべくしてされる」表示他获得信任是理所当然的必然结果"}]},
"226": {"analysis": "「〜べくもない」表示由于客观条件的限制（如信息缺失、身份地位不够等），根本没有可能去做前项这件事，是非常书面、正式的强烈否定表达，常带有一种无奈、遗憾但不得不承认不可能的语气，多见于议论文、随笔中。", "mistakes": "❌ 知るべくもなかった（改变时态需注意） → 该表达也可用べくもなかった表达过去的不可能，但需注意べくもない整体是固定的文语否定表达，不能拆分替换其中的べく或もない部分", "similar": [{"form": "〜はずがない", "diff": "「はずがない」是基于逻辑推理的不可能，「べくもない」更强调客观条件根本不允许，连尝试的可能性都没有"}, {"form": "〜ようがない", "diff": "「ようがない」表示没有方法手段做到，「べくもない」更书面古雅，且隐含连想都不用想的彻底否定"}, {"form": "知る由もない", "diff": "「知る由もない」是与「知るべくもない」意思几乎完全相同的固定表达，都表示无从得知，常互换使用"}], "quiz": [{"q": "昔の記録が失われてしまった今、正確な数字を知る____。", "opts": ["A. べくもない", "B. べからざる", "C. までもない", "D. にたえない"], "ans": "A", "exp": "「知るべくもない」表示如今已经无法知道准确的数字了"}, {"q": "専門家でもない私に、この複雑な問題を解決する____。", "opts": ["A. べくもない", "B. べからざる", "C. までもない", "D. にかたくない"], "ans": "A", "exp": "「解決するべくもない」表示不是专家的自己根本不可能解决这个复杂问题"}, {"q": "証拠がすべて処分された今となっては、真実を証明する____。", "opts": ["A. べくもない", "B. べからざる", "C. までもない", "D. にたえない"], "ans": "A", "exp": "「証明するべくもない」表示证据都被销毁了，现在根本无法证明真相"}]},
"227": {"analysis": "「〜まみれ」接在表示污秽物、令人厌恶事物的名词后，表示整个人或物体表面全被这种东西覆盖，字面意思多用于汗、泥、血、埃等实际的污渍，也可比喻性地用于借金まみれ（债务缠身）等负面抽象概念，带有强烈的负面语感。", "mistakes": "❌ 幸せまみれ（正面事物搭配不当） → 「まみれ」专用于负面、令人不快的事物（污垢、血、汗、借金等），不能用于幸福、快乐等正面概念，那种情况应使用〜だらけ中性一些的说法或其他积极表达", "similar": [{"form": "〜だらけ", "diff": "「だらけ」的适用范围比「まみれ」更广，可以是液体状污渍也可以是間違いだらけ（全是错误）等抽象概念，「まみれ」更侧重沾满、覆盖的具体物理状态"}, {"form": "〜ずくめ", "diff": "「ずくめ」表示清一色都是…，语义偏中性甚至正面（いいことずくめ），与「まみれ」强烈的负面语感形成对比"}, {"form": "〜にまみれる", "diff": "是「まみれ」的动词原形用法，泥にまみれる（沾满泥巴），「まみれ」是其名词化、常接在名词后的形式"}], "quiz": [{"q": "汗____になりながら、彼はマラソンを完走した。", "opts": ["A. まみれ", "B. だらけ", "C. ずくめ", "D. がち"], "ans": "A", "exp": "「汗まみれ」表示浑身都是汗水，まみれ更强调液体状污渍覆盖全身的具体状态"}, {"q": "あの会社は不正____の経営を続けていた。", "opts": ["A. まみれ", "B. づけ", "C. がち", "D. ぎみ"], "ans": "A", "exp": "「不正まみれの経営」表示那家公司的经营一直充斥着舞弊行为"}, {"q": "工事のあと、部屋中がほこり____になっていた。", "opts": ["A. まみれ", "B. づけ", "C. がち", "D. ぎみ"], "ans": "A", "exp": "「ほこりまみれ」表示房间里到处都沾满了灰尘"}]},
"228": {"analysis": "「〜ように見える／聞こえる／思える」分别通过视觉、听觉、思维感受这三种不同的感官/心理渠道，表达说话人根据外在印象做出的主观判断或推测，比直接断定的说法更委婉、更留有余地，是日语中表达看似…常用的基础句型组合。", "mistakes": "❌ 见える/聞こえる/思える混用不分场合（语义搭配不当） → 需根据具体的感知来源选择对应动词：视觉印象用見える，听觉印象（说话语气、声音）用聞こえる，综合判断/感受用思える，三者不能随意互换", "similar": [{"form": "〜ようだ", "diff": "「ようだ」是更泛用的样态推测，「〜ように見える」等则明确指出了通过什么感官渠道得出的印象，更具体"}, {"form": "〜みたいだ", "diff": "「みたいだ」是ようだ的口语形式，同样比「〜ように見える」笼统，没有指明具体感官来源"}, {"form": "〜と感じられる", "diff": "「と感じられる」是更直接的让人感受到…，与「ように思える」意思接近，可互换"}], "quiz": [{"q": "このグラフを見ると、売り上げは順調に伸びている____。", "opts": ["A. ように見える", "B. ように聞こえる", "C. のように", "D. ようになる"], "ans": "A", "exp": "「伸びているように見える」是根据图表这一视觉信息做出的判断，用見える"}, {"q": "電話越しの彼の声は、なんだか落ち込んでいる____。", "opts": ["A. ように聞こえた", "B. ように見えた", "C. ように思われた", "D. ようになった"], "ans": "A", "exp": "「落ち込んでいるように聞こえた」是根据电话中的声音（听觉）做出的判断，用聞こえる"}, {"q": "彼女の話を聞く限り、この計画には無理がある____。", "opts": ["A. ように思える", "B. ように見える", "C. ように聞こえる", "D. ようになる"], "ans": "A", "exp": "「無理があるように思える」是综合听完话后的整体感受判断，用思える"}]},
"229": {"analysis": "「〜めく」是接在名词后构成动词的接尾词，表示逐渐呈现出该名词所代表的气息、样子，其连体形〜めいた则直接修饰后面的名词，两者都带有一定的文学性、修辞色彩，常用于描写季节变化、氛围、言行举止的微妙感觉。", "mistakes": "❌ 春めく季節になった（应为めいた修饰名词） → ✅ 春めいた季節になった（若要修饰后面的名词季節，需要用连体形めいた，而不是终止形めく）", "similar": [{"form": "〜っぽい", "diff": "「っぽい」是更口语、通俗的带有…感觉，「めく」更书面、文学化，常用于书面文章、诗歌"}, {"form": "〜がかった", "diff": "「がかった」表示带有…色彩倾向，常用于颜色（黄色がかった），与「めく」表示氛围、感觉的用法略有不同"}, {"form": "〜じみた", "diff": "「じみた」也表示带有…气息，但常带有贬义色彩（子供じみた＝幼稚），「めいた」的感情色彩相对更中性"}], "quiz": [{"q": "四月になり、桜も咲き始め、すっかり____きた。", "opts": ["A. 春めいて", "B. 春っぽく", "C. 春がかって", "D. 春じみて"], "ans": "A", "exp": "「春めいてきた」表示天气渐渐呈现出春天的气息，是书面常用的表达"}, {"q": "彼の話し方には、どこか説教____ところがあって、少し疲れる。", "opts": ["A. めいた", "B. っぽい", "C. がかった", "D. づけの"], "ans": "A", "exp": "「説教めいた」表示他的说话方式带有几分说教的意味"}, {"q": "その古い建物には、どこか謎____雰囲気が漂っていた。", "opts": ["A. めいた", "B. っぽい", "C. がかった", "D. ぎみの"], "ans": "A", "exp": "「謎めいた雰囲気」表示那座古老建筑弥漫着神秘的气息"}]},
"230": {"analysis": "「〜も顧みず」表示完全不考虑、不在意前项这个本应该重视的事物（自身安危、他人反对、健康等），毅然采取了后面的行动，带有说话人对这种奋不顾身、不计后果的行为的赞叹或感慨语气，是书面正式的表达。", "mistakes": "❌ 顧みずも（语序颠倒） → ✅ も顧みず（固定语序是名词+も+顧みず，もが不能放在顧みず后面）", "similar": [{"form": "〜をものともせず", "diff": "「をものともせず」强调不把困难、障碍当回事，克服了它，「も顧みず」更强调完全不考虑某个重要事物（可能是自身利益）就采取了行动"}, {"form": "〜にもかかわらず", "diff": "「にもかかわらず」是客观陈述尽管…的转折，「も顧みず」更强调主观上主动选择不去考虑的意志和牺牲精神"}, {"form": "〜を顧みない", "diff": "「を顧みない」是「も顧みず」的原形否定，意思相同，「も顧みず」是其て形（连用中顿）用法，用于连接后续行为"}], "quiz": [{"q": "消防士たちは自らの命____、炎の中に飛び込んでいった。", "opts": ["A. も顧みず", "B. をよそに", "C. にもまして", "D. をものともせず"], "ans": "A", "exp": "「命も顧みず」表示消防员们不顾自身生命危险，冲进了火海"}, {"q": "彼女は周囲の反対____、その道を選んだ。", "opts": ["A. も顧みず", "B. にもまして", "C. をものともせず", "D. にかまけず"], "ans": "A", "exp": "「反対も顧みず」表示她不顾周围的反对，选择了那条路"}, {"q": "研究者は自身の健康____、実験を続けた。", "opts": ["A. も顧みず", "B. にもまして", "C. をよそに", "D. につけず"], "ans": "A", "exp": "「健康も顧みず」表示研究者不顾自己的健康，继续进行实验"}]},
"231": {"analysis": "「もっとも」是接续词，用于在陈述了一个观点或事实之后，紧接着补充一个例外情况、限制条件或轻微的保留意见，语气比较缓和、客观，常用于书面和口语中让论述显得更周全、不绝对化。", "mistakes": "❌ 与形容词最も（もっとも，最...）混淆 → 「もっとも」作为接续词（不过、话虽如此）与作为副词最も（最…，如最も重要な）虽然读音相同，但意思、词性、汉字写法完全不同，需根据上下文和是否有汉字来区分", "similar": [{"form": "ただし", "diff": "「ただし」是更正式书面的但是、附带条件，语气比「もっとも」略微更强调附加限定条件"}, {"form": "とはいえ", "diff": "「とはいえ」是虽说如此的转折，转折程度比「もっとも」稍强，「もっとも」更像是轻描淡写的补充说明"}, {"form": "といっても", "diff": "「といっても」表示虽说…（但没那么夸张），与「もっとも」都用于补充说明，但「といっても」更强调程度上的修正"}], "quiz": [{"q": "今度のテストは簡単だった。____、油断は禁物だが。", "opts": ["A. もっとも", "B. ところが", "C. ならびに", "D. したがって"], "ans": "A", "exp": "「もっとも」在此用于对考试简单这一陈述追加一个提醒性的保留意见"}, {"q": "彼女はいつも明るい。____、悩みがないわけではないだろう。", "opts": ["A. もっとも", "B. ところで", "C. さて", "D. ゆえに"], "ans": "A", "exp": "「もっとも」用于对她总是很开朗这一印象做出补充说明"}, {"q": "このレストランはサービスがいい。____、値段はそれなりにするが。", "opts": ["A. もっとも", "B. ところで", "C. さらに", "D. よって"], "ans": "A", "exp": "「もっとも」用于补充说明这家餐厅虽然服务好，但价格也相应较高"}]},
"232": {"analysis": "「〜ものと思われる」是新闻报道、论文、正式报告中常用的客观推测表达，用被动的形式（思われる）弱化说话人的主观色彩，使推测显得更加中立、客观，常用于陈述基于证据或调查得出的合理推断。", "mistakes": "❌ 私はものと思われる（第一人称使用不当） → 该表达本身通过被动形式弱化主观性，营造这是普遍、客观看法的语感，通常不与私は等明确的第一人称主语搭配使用，否则会显得矛盾（既要客观又要强调主观），日常口语中直接说〜と思う即可", "similar": [{"form": "〜と考えられる", "diff": "意思、用法与「ものと思われる」几乎完全相同，都是客观正式的推测表达，可互换"}, {"form": "〜とみられる", "diff": "「とみられる」常见于新闻标题、简讯，语气与「ものと思われる」相近但更简洁"}, {"form": "〜だろう", "diff": "「だろう」是最基础的推测表达，口语和书面都可用，但不如「ものと思われる」正式、客观"}], "quiz": [{"q": "この遺跡は、紀元前3世紀ごろに建設された____。", "opts": ["A. ものと思われる", "B. ものだ", "C. ものである", "D. ものとする"], "ans": "A", "exp": "「建設されたものと思われる」是考古报告中常见的客观推测表达"}, {"q": "今後数年で、この分野の市場はさらに拡大していく____。", "opts": ["A. ものと思われる", "B. ものだ", "C. ものとする", "D. ものを"], "ans": "A", "exp": "「拡大していくものと思われる」是分析报告中对未来趋势的客观推测"}, {"q": "現場の状況から、火災は台所付近から発生した____。", "opts": ["A. ものと思われる", "B. ものだ", "C. ものとする", "D. ものを"], "ans": "A", "exp": "「発生したものと思われる」是消防调查报告中对火灾原因的客观推测表达"}]},
"233": {"analysis": "「〜れる／〜られる」除了表示被动、可能、尊敬之外，还有第四种用法——自発，接在思う、感じる、案じる、しのばれる等表示感情、思考的动词后，表示某种感情或想法并非主观刻意产生，而是自然而然、情不自禁地浮现出来，是N1中容易被忽略、但阅读中常见的用法。", "mistakes": "❌ 与被动用法混淆（同形异义需辨析） → 「〜れる／られる」的自発用法与被动用法在形态上完全相同，区分的关键在于动词种类（思う、感じる等感情/思考动词多为自発）和句子逻辑（自発句通常没有被谁怎样的施动者，而是情感自然涌现）", "similar": [{"form": "〜てならない", "diff": "「てならない」也表示情感自然涌现、无法抑制，与自発用法的思われる等意思接近，两者常可互换使用"}, {"form": "被动用法（受身）", "diff": "被动用法强调被某人/某事施加了动作，自発用法没有明确的施动者，是情感/想法自然产生，两者形态相同但语义、逻辑不同"}, {"form": "〜と感じる", "diff": "「と感じる」是主动、明确地表达我觉得…，「〜られる」自発形式更强调不由自主、自然而然的被动感受色彩"}], "quiz": [{"q": "年を取るにつれて、両親の苦労が____ようになった。", "opts": ["A. しのばれる", "B. しのぶ", "C. しのばせる", "D. しのばさせる"], "ans": "A", "exp": "「苦労がしのばれる」是自発用法，表示不由得体会到父母的辛苦"}, {"q": "この曲を聞くと、昔の楽しかった日々が____。", "opts": ["A. 思い出される", "B. 思い出す", "C. 思い出させる", "D. 思い出させられる"], "ans": "A", "exp": "「日々が思い出される」是自発用法，表示自然而然地回想起过去"}, {"q": "一人で暮らす祖母のことが____てならない。", "opts": ["A. 案じられ", "B. 案じ", "C. 案じさせ", "D. 案じさせられ"], "ans": "A", "exp": "「案じられてならない」是自発用法与てならない搭配，表示不由自主地担心"}]},
"234": {"analysis": "「〜てはやりきれない」表示如果一直持续前项这种令人痛苦、不合理或悲伤的状态，说话人在精神/情感上将无法承受，带有强烈的诉苦、抱怨或悲叹的语气，常用于表达对不公平待遇或持续辛劳的忍耐已经到达极限。", "mistakes": "❌ 楽しくてはやりきれない（正面情绪搭配不当） → 该表达专用于表达痛苦、不合理、令人心酸等负面情绪已经到达无法忍受的极限，不能用于正面、开心的情绪，逻辑上矛盾", "similar": [{"form": "〜てはたまらない", "diff": "意思、用法与「てはやりきれない」非常接近，都表示这样下去受不了，「たまらない」更口语，「やりきれない」更侧重心理上无法排解、消化的沉重感"}, {"form": "〜ではいられない", "diff": "「ではいられない」强调客观情况紧迫，无法继续保持某状态，「てはやりきれない」更强调精神、情感上的痛苦已达极限"}, {"form": "〜に堪えない", "diff": "「に堪えない」也表达无法忍受，但更偏向目睹某惨状而痛心，「てはやりきれない」更强调自身持续承受某种境遇的疲惫和心酸"}], "quiz": [{"q": "これだけ頑張ったのに評価されないの____。", "opts": ["A. ではやりきれない", "B. にはたえない", "C. にはあたらない", "D. にはおよばない"], "ans": "A", "exp": "「評価されないのではやりきれない」表示这么努力却得不到认可，实在让人无法忍受"}, {"q": "また台風で作物がだめになった。こう毎年____。", "opts": ["A. ではやりきれない", "B. にはたえない", "C. にはあたらない", "D. にはおよばない"], "ans": "A", "exp": "「こう毎年ではやりきれない」表示年年都遭遇台风，实在令人心力交瘁"}, {"q": "無実の罪で非難され____気持ちだ。", "opts": ["A. てはやりきれない", "B. にはたえない", "C. にはあたらない", "D. にはおよばない"], "ans": "A", "exp": "「非難されてはやりきれない」表示因无端的罪名被指责，心里感到无法承受的委屈"}]},
"235": {"analysis": "「やれ〜やれ〜と」用于列举两个以上琐碎、繁杂的要求或抱怨事项，模仿转述某人反复唠叨、抱怨的语气，说话人（转述者）通常带有一丝不耐烦或调侃的评价态度，是非常口语化的表达。", "mistakes": "❌ 正式场合、书面语中使用（语域不当） → 该表达是相当随意、带有调侃色彩的口语表达，多用于模仿转述他人的唠叨抱怨，不适用于正式的书面文章或礼貌场合", "similar": [{"form": "〜だの〜だのと", "diff": "「だの〜だのと」意思、用法与「やれ〜やれ〜と」非常接近，都表示列举抱怨，语气同样口语化"}, {"form": "あれこれと", "diff": "「あれこれと」是更泛化的这样那样地，没有「やれ〜やれ」那种模拟具体唠叨内容的生动画面感"}, {"form": "何やかやと", "diff": "「何やかやと」表示种种、这样那样，与「やれ〜やれ」意思相近，都用于描述繁杂琐碎的事情"}], "quiz": [{"q": "____片付けろ、____静かにしろと、母は毎日口うるさい。", "opts": ["A. やれ／やれ", "B. だの／だの", "C. のみ／のみ", "D. さえ／さえ"], "ans": "A", "exp": "「やれ片付けろ、やれ静かにしろ」模仿转述母亲反复唠叨的口吻"}, {"q": "____忙しい、____疲れたと、彼はいつも愚痴をこぼしている。", "opts": ["A. やれ／やれ", "B. のみ／のみ", "C. すら／すら", "D. さえ／さえ"], "ans": "A", "exp": "「やれ忙しい、やれ疲れた」表示他总是抱怨这抱怨那"}, {"q": "新しい上司は____これをしろ、____あれをしろと、要求が多い。", "opts": ["A. やれ／やれ", "B. のみ／のみ", "C. すら／すら", "D. さえ／さえ"], "ans": "A", "exp": "「やれこれをしろ、やれあれをしろ」表示新上司要求繁多，一会儿要这样一会儿要那样"}]},
"236": {"analysis": "「〜ようがない」接在动词ます形后，表示因为缺乏必要的方法、手段或条件，导致完全没有可能实现前项这个动作，是客观陈述无计可施状态的常用表达，比術がない更口语常用，比できない更强调连方法都想不出来的彻底性。", "mistakes": "❌ しようがない（与仕方がない意思混淆） → 〜（動詞）ようがない表示没有…的方法，而しようがない除了字面意思外，还常作为固定短语表示没办法、无奈（=仕方がない），需根据语境判断是字面意思还是固定短语的引申义", "similar": [{"form": "〜術がない", "diff": "「術がない」是更书面、文学性的说法，「ようがない」是更常用、口语化的表达，意思相同"}, {"form": "〜方法がない", "diff": "「方法がない」是最直白的说法没有方法，「ようがない」更简洁，直接接在动词后面"}, {"form": "〜にも〜ない（うにも〜ない）", "diff": "「（よ）うにも〜ない」表示即使想做也做不到，强调有意愿但条件不允许，「ようがない」更客观地陈述根本没有方法，不特别强调意愿"}], "quiz": [{"q": "彼がどこにいるのか誰も知らないので、探し____。", "opts": ["A. ようがない", "B. かねない", "C. っこない", "D. がたい"], "ans": "A", "exp": "「探しようがない」表示因为没人知道他在哪，根本没办法找"}, {"q": "マニュアルがなければ、この機械の使い方を理解し____。", "opts": ["A. ようがない", "B. かねない", "C. っこない", "D. がたい"], "ans": "A", "exp": "「理解しようがない」表示没有说明书就没办法理解这台机器的用法"}, {"q": "壊れてしまったこの器械は、もう直し____。", "opts": ["A. ようがない", "B. かねない", "C. っこない", "D. がたい"], "ans": "A", "exp": "「直しようがない」表示这台已经坏掉的机器，已经没办法修理了"}]},
"237": {"analysis": "「〜ように」接在动词辞書形或ない形后，用于表达祈愿某事发生/不发生，或委婉地向对方发出指示、要求，也可表示为了…这个目的，是应用广泛、语气委婉的基础句型，在N1语境中常见于书信结尾的祝福语或郑重的间接指示。", "mistakes": "❌ 幸せようだ（误加だ变成推测） → ✅ 幸せでありますように（表达祈愿时，句尾直接以ように结束（有时后面省略祈ります等），不能再接だ变成推测句式，两者语法功能完全不同）", "similar": [{"form": "〜ことを祈る", "diff": "「ことを祈る」是更明确直白的祈祷…，「ように」更含蓄、常作为句尾的省略表达"}, {"form": "〜てください", "diff": "「てください」是直接的请求指示，「ように」作为间接指示（如〜ように言っておいた转达他人的指示）语气更委婉、正式"}, {"form": "〜べく", "diff": "「べく」表示为了…的书面目的用法，与「ように」表目的的用法意思接近，但「べく」更古典书面"}], "quiz": [{"q": "風邪をひかない____、暖かくしてお休みください。", "opts": ["A. ように", "B. からには", "C. とばかりに", "D. ものを"], "ans": "A", "exp": "「ひかないように」表示为了不感冒这一目的/提醒"}, {"q": "来年こそ、いい年になります____。", "opts": ["A. ように", "B. からには", "C. とばかりに", "D. ものを"], "ans": "A", "exp": "「なりますように」表达对明年的祈愿，希望是美好的一年"}, {"q": "先生は学生たちに、静かにする____注意した。", "opts": ["A. ように", "B. からには", "C. とばかりに", "D. ものを"], "ans": "A", "exp": "「静かにするように」表示老师向学生传达了要求"}]},
"238": {"analysis": "「〜を押して」表示不顾身体不适、恶劣条件等困难因素，坚持去做某事；「〜を押し切って」则表示不顾他人的反对、阻止，强行按照自己的意愿推进，两者都强调以坚强意志克服阻碍的语感，是书面正式的表达。", "mistakes": "❌ 混淆押して和押し切って的对象（用法误用） → 「を押して」通常搭配病気、悪天候等客观不利条件；「を押し切って」通常搭配反対、批判等他人的阻力，两者搭配对象有所不同，不能随意互换", "similar": [{"form": "〜にもかかわらず", "diff": "「にもかかわらず」是客观陈述尽管…的转折，「を押して」更强调主观上忍着困难坚持的意志力"}, {"form": "〜をものともせず", "diff": "「をものともせず」表示不把困难当回事，与「を押して」意思接近，都强调克服困难的坚强意志"}, {"form": "〜を振り切って", "diff": "「を振り切って」表示甩开、摆脱（挽留、反对等），与「を押し切って」意思相近，都表示不顾阻力强行推进"}], "quiz": [{"q": "祖母は高齢____、孫の結婚式に出席した。", "opts": ["A. を押して", "B. をよそに", "C. にひきかえ", "D. にかまけて"], "ans": "A", "exp": "「高齢を押して」表示祖母不顾高龄，出席了孙子的婚礼"}, {"q": "彼は会社の反対____、独立起業を果たした。", "opts": ["A. を押し切って", "B. をよそに", "C. にひきかえ", "D. にかまけて"], "ans": "A", "exp": "「反対を押し切って」表示他不顾公司的反对，实现了独立创业"}, {"q": "医師の忠告____、彼は無理をして働き続けた。", "opts": ["A. を押し切って", "B. をものとして", "C. にひきかえて", "D. にかまけて"], "ans": "A", "exp": "「忠告を押し切って」表示他不顾医生的劝告，继续勉强工作"}]},
"239": {"analysis": "「〜を限りに」表示以前项这个时间点作为最后的界限，从此以后就不再继续（该行为、状态），常用于宣布结束、告别的正式场合；「〜の限り」则接在力、声、命等词后，表示用尽…的极限，两者虽都含限り但用法方向不同，需注意区分。", "mistakes": "❌ 混淆两种限り的用法（意思方向不同） → 「〜を限りに」强调以此为界，终止，「〜の限り」强调竭尽全力，用到极限，二者虽字形相似但语义指向完全不同，一个是时间终点，一个是程度极限", "similar": [{"form": "〜を最後に", "diff": "「を最後に」意思、用法与「を限りに」几乎完全相同，都表示以…为最后一次，可互换"}, {"form": "力の限り", "diff": "是「の限り」最常见的固定搭配之一，力の限り頑張る（尽全力努力），强调竭尽全力"}, {"form": "〜からというもの", "diff": "「からというもの」表示自从…以后一直，与「を限りに」表示从此终止的方向恰好相反，注意区分"}], "quiz": [{"q": "今月____、長年勤めた会社を退職することにした。", "opts": ["A. を限りに", "B. にひきかえ", "C. をよそに", "D. にかまけて"], "ans": "A", "exp": "「今月を限りに」表示以这个月为最后期限，即将从公司退休"}, {"q": "彼女は声____助けを求めて叫び続けた。", "opts": ["A. の限り", "B. をよそに", "C. にひきかえ", "D. にかまけて"], "ans": "A", "exp": "「声の限り」表示用尽全部力气呼喊求救"}, {"q": "この曲を____、そのバンドは解散した。", "opts": ["A. 最後に", "B. よそに", "C. ひきかえに", "D. かまけて"], "ans": "A", "exp": "「この曲を最後に」表示以这首曲子为最后一首，之后乐队解散了（をかぎりに/を最後に均可）"}]},
"240": {"analysis": "「〜をないがしろにする」表示完全不重视、轻慢地对待本应该珍视、遵守的事物（人际关系、规则、承诺等），带有明确的批评语气，指责对方的这种忽视态度是不负责任、不应该的。", "mistakes": "❌ をないがしろにされる（被动使用需注意语感） → 被动形式をないがしろにされる（被…忽视）语法上可行，但更常见的是主动形式批评某人ないがしろにする（某事物），使用被动形式时需确保逻辑通顺", "similar": [{"form": "〜を軽んじる", "diff": "「を軽んじる」是更简洁的书面说法，意思与「をないがしろにする」几乎相同，都表示轻视"}, {"form": "〜を疎かにする", "diff": "「を疎かにする」侧重敷衍、不认真对待，与「をないがしろにする」的完全不重视、轻慢语气略有不同，程度稍轻"}, {"form": "〜を軽視する", "diff": "「を軽視する」是更正式、书面化的说法，意思相同，常用于评论、报告中"}], "quiz": [{"q": "健康____ような生活を続けていると、いつか後悔することになる。", "opts": ["A. をないがしろにする", "B. をよそにする", "C. にかまける", "D. にひきかえる"], "ans": "A", "exp": "「健康をないがしろにする」批评不重视健康的生活方式"}, {"q": "彼は約束事____傾向があり、周囲の信頼を失いつつある。", "opts": ["A. をないがしろにする", "B. をよそにする", "C. にかまける", "D. にひきかえる"], "ans": "A", "exp": "「約束事をないがしろにする」表示他有轻视约定的倾向"}, {"q": "基本____やり方では、いずれ大きな失敗を招くだろう。", "opts": ["A. をないがしろにする", "B. をよそにする", "C. にかまける", "D. にひきかえる"], "ans": "A", "exp": "「基本をないがしろにする」表示忽视基础的做法迟早会招致重大失败"}]},
"241": {"analysis": "「〜をなおざりにする」表示对本应认真对待的事情敷衍了事、草草应付，没有投入应有的精力，与「をないがしろにする」意思、用法非常接近，都带有批评的语气，两者常可互换使用，是N1中容易混淆的近义词对。", "mistakes": "❌ 与をないがしろにする意思完全等同混用（细微差异需了解） → 两者意思高度接近可互换，但なおざり更侧重敷衍、应付了事（消极懈怠），ないがしろ更侧重轻视、不放在眼里（态度上的蔑视），语感略有差异", "similar": [{"form": "〜をないがしろにする", "diff": "意思、用法与「をなおざりにする」非常接近，几乎可互换，ないがしろ更强调轻视，なおざり更强调敷衍"}, {"form": "〜をおろそかにする", "diff": "「をおろそかにする」意思、用法也与なおざりにする高度重合，都表示马虎对待，三者（ないがしろ/なおざり/おろそか）是一组常考的近义表达"}, {"form": "いい加減に〜する", "diff": "「いい加減に〜する」是更口语的说法马马虎虎地做…，与「をなおざりにする」意思相近但更随意口语"}], "quiz": [{"q": "目の前の仕事に追われて、健康管理____がちだ。", "opts": ["A. をなおざりにし", "B. をよそにし", "C. にかまけ", "D. にひきかえ"], "ans": "A", "exp": "「健康管理をなおざりにしがちだ」表示容易敷衍健康管理"}, {"q": "基本の練習____、いきなり応用問題に取り組んでも成果は出ない。", "opts": ["A. をなおざりにして", "B. をよそにして", "C. にかまけて", "D. にひきかえて"], "ans": "A", "exp": "「基本の練習をなおざりにして」表示如果敷衍基础练习，直接做应用题也不会有成效"}, {"q": "細部____大まかな計画だけでは、成功はおぼつかない。", "opts": ["A. をなおざりにした", "B. をよそにした", "C. にかまけた", "D. にひきかえた"], "ans": "A", "exp": "「細部をなおざりにした」表示忽视细节、敷衍了事的粗略计划难以成功"}]},
"242": {"analysis": "「〜を控えて」表示某个重要的事件、活动即将到来，处于其临近的阶段，常用于描写在重大事情来临前的心理状态（紧张、忙碌准备等），是书面、正式的时间背景描写表达。", "mistakes": "❌ 試験が控えて（助词误用） → ✅ 試験を控えて（控えて是他动词用法，前面接续宾格助词を，不能用主格助词が）", "similar": [{"form": "〜を目前にして", "diff": "「を目前にして」意思、用法与「を控えて」非常接近，都表示即将来临，语气都较为正式"}, {"form": "〜が近づいて", "diff": "「が近づいて」是更基础、口语化的说法…临近了，「を控えて」更书面、常用于描述郑重场合前的准备状态"}, {"form": "〜を前にして", "diff": "「を前にして」也表示面临…，与「を控えて」意思接近，语域相近，可互换使用"}], "quiz": [{"q": "受験____、彼は毎日夜遅くまで勉強している。", "opts": ["A. を控えて", "B. をよそに", "C. にひきかえ", "D. にかまけて"], "ans": "A", "exp": "「受験を控えて」表示考试临近，他每天学习到很晚"}, {"q": "開業____、店内の最終チェックに追われている。", "opts": ["A. を控えて", "B. をよそに", "C. にひきかえ", "D. にかまけて"], "ans": "A", "exp": "「開業を控えて」表示开业在即，正忙于店内的最终检查"}, {"q": "出産____、彼女は育児用品を準備し始めた。", "opts": ["A. を控えて", "B. をよそに", "C. にひきかえ", "D. にかまけて"], "ans": "A", "exp": "「出産を控えて」表示临近分娩，她开始准备育儿用品"}]},
"243": {"analysis": "「〜を振り出しに」中振り出し原指双六棋盘游戏的起点，整体表示以前项作为一系列经历、发展的最初出发点，后续不断扩展、深入，常用于描述个人职业生涯、企业发展历程等逐步扩大的过程，是书面正式的表达。", "mistakes": "❌ を振り出して（活用形误用） → ✅ を振り出しに（振り出し是名词，固定搭配を振り出しに，不能变成动词て形振り出して）", "similar": [{"form": "〜を皮切りに", "diff": "「を皮切りに」意思、用法与「を振り出しに」非常接近，都表示以…为开端，但「を皮切りに」更强调接连不断发生同类事件的开端，「振り出しに」更强调逐步发展、扩展的出发点"}, {"form": "〜を出発点として", "diff": "「を出発点として」是更直白的说法以…为出发点，与振り出しに意思相同但更通俗易懂"}, {"form": "〜からスタートして", "diff": "「からスタートして」是更口语化的说法从…开始，与振り出しに的书面正式语感形成对比"}], "quiz": [{"q": "彼は小さな町工場____、大企業の社長にまで上り詰めた。", "opts": ["A. を振り出しに", "B. を皮切りに", "C. にひきかえ", "D. にかまけて"], "ans": "A", "exp": "「町工場を振り出しに」表示他以小工厂为起点，一路发展到大企业社长的位置"}, {"q": "このバンドは学園祭のライブ____、プロとして活動するようになった。", "opts": ["A. を振り出しに", "B. をよそに", "C. にひきかえ", "D. にかまけて"], "ans": "A", "exp": "「ライブを振り出しに」表示这个乐队以校园祭的演出为起点，之后作为职业乐队活动"}, {"q": "彼女は下積み時代____、着実にキャリアを積んできた。", "opts": ["A. を振り出しに", "B. をよそに", "C. にひきかえ", "D. にかまけて"], "ans": "A", "exp": "「下積み時代を振り出しに」表示她以基层历练时期为起点，扎实地积累了职业生涯"}]},
"244": {"analysis": "「〜を前にして」表示处于面对前项这个重要的人、事物或场景的状态下，可以指具体的空间位置上在…面前，也可以指时间上即将面临…，常用于描写在重大场合、挑战面前的心理反应或态度。", "mistakes": "❌ を控えてと完全等同混用（细微差异需了解） → を控えて更单纯地表示时间上临近，を前にして除了时间临近，还可用于空间上面对面的具体场景（如観客を前にして面对观众），适用范围更广一些", "similar": [{"form": "〜を控えて", "diff": "「を控えて」更侧重时间临近，「を前にして」既可指时间临近，也可指空间上面对面，适用范围更广"}, {"form": "〜に直面して", "diff": "「に直面して」强调正面面对（困难、问题等），与「を前にして」表示面临困境的用法接近"}, {"form": "〜のとき", "diff": "「のとき」是最基础的…的时候，没有「を前にして」那种即将面临、正对着的紧迫感和画面感"}], "quiz": [{"q": "大自然の雄大さ____、人間の存在の小ささを感じた。", "opts": ["A. を前にして", "B. をよそにして", "C. にひきかえて", "D. にかまけて"], "ans": "A", "exp": "「雄大さを前にして」表示面对大自然的雄伟，感受到人类的渺小"}, {"q": "人生の岐路____、彼女は決断を迫られていた。", "opts": ["A. を前にして", "B. をよそにして", "C. にひきかえて", "D. にかまけて"], "ans": "A", "exp": "「岐路を前にして」表示面临人生的十字路口，她被迫做出决断"}, {"q": "厳しい現実____、彼はどう対処すべきか悩んでいた。", "opts": ["A. を前にして", "B. をよそにして", "C. にひきかえて", "D. にかまけて"], "ans": "A", "exp": "「現実を前にして」表示面对严峻的现实，他在苦恼该如何应对"}]},
"245": {"analysis": "「〜んじゃなかった」（是のではなかった的口语缩约形）接在动词辞書形后，句尾用过去否定なかった，表示事后懊悔——早知道就不该做这件事了；「〜（る）んじゃない」同样接辞書形，但句尾用现在否定ない，是不准做…的口语强硬禁止表达。两者前接的动词形态相同（都是辞書形），仅凭句尾なかった还是ない来区分意思，是容易混淆的听力、口语考点。", "mistakes": "❌ 仅凭前接动词形态判断意思（辨析关键有误） → 「んじゃなかった」与「んじゃない」前面都接动词辞書形，区分两者意思的关键并不在前面动词的时态，而在于句尾究竟是过去否定的なかった（后悔）还是现在否定的ない（禁止），需要听清/看清句尾才能准确判断", "similar": [{"form": "〜なければよかった", "diff": "「なければよかった」是更直白清晰的后悔表达，与「んじゃなかった」表后悔的意思相同，「んじゃなかった」更口语随意"}, {"form": "〜てはいけない", "diff": "「てはいけない」是更普遍通用的禁止表达，「（る）んじゃない」是更强硬、口语化（常用于家长/长辈训斥晚辈）的禁止说法"}, {"form": "〜べきではなかった", "diff": "「べきではなかった」是更书面、正式的不应该…的后悔/批评表达，与「んじゃなかった」的口语后悔用法相近但语域不同"}], "quiz": [{"q": "あんな人を信じる____、今になって後悔している。", "opts": ["A. んじゃなかった", "B. んじゃない", "C. ものだった", "D. ことだった"], "ans": "A", "exp": "「信じるんじゃなかった」句尾是过去否定なかった，表示后悔当初相信了那个人"}, {"q": "危ないから、そこに近づく____！", "opts": ["A. んじゃない", "B. んじゃなかった", "C. ことはない", "D. ものではなかった"], "ans": "A", "exp": "「近づくんじゃない」句尾是现在否定ない，是禁止靠近的强硬口语表达"}, {"q": "もっと勉強しておく____と、試験の後で反省した。", "opts": ["A. んじゃなかった", "B. んじゃない", "C. ものだった", "D. ことだった"], "ans": "A", "exp": "「勉強しておくんじゃなかった」表示考试后反省早知道就该多学习"}]},
"246": {"analysis": "「〜んばかりに」接在动词ない形去掉ない的部分后（如泣かない→泣かんばかりに），表示看起来几乎就要发生某个动作/达到某种状态了，但实际上并未真正发生，用来极其生动地描写人物或事物逼近极限的样子，是文学性很强的书面修辞表达。", "mistakes": "❌ 泣くんばかりに（接续错误） → ✅ 泣かんばかりに（必须先将动词变为ない形泣かない，再去掉ない接んばかりに，即泣か+んばかりに，不能直接用辞書形泣く）", "similar": [{"form": "〜とばかりに", "diff": "「とばかりに」表示仿佛在说…似的，通过言语内容暗示心理；「んばかりに」表示动作/状态几乎要达到某种程度，通过外在样态描写逼真程度，两者形似但描写角度不同"}, {"form": "今にも〜そうだ", "diff": "「今にも〜そうだ」是更基础、通俗的说法眼看就要…，与「んばかりに」意思相近，但「んばかりに」更书面、文学化"}, {"form": "〜せんばかりの勢いで", "diff": "是「んばかりに」的常见变体搭配，（動詞未然形）せんばかりの勢いで，多用于サ変动词，如爆発せんばかりの勢いで"}], "quiz": [{"q": "合格の知らせを聞いて、彼女は飛び上がら____喜んだ。", "opts": ["A. んばかりに", "B. とばかりに", "C. がばかりに", "D. こそばかりに"], "ans": "A", "exp": "「飛び上がらんばかりに」表示她高兴得几乎要跳起来的样子"}, {"q": "彼はもう我慢できないと言わ____、机を叩いた。", "opts": ["A. んばかりに", "B. とばかりに", "C. がばかりに", "D. こそばかりに"], "ans": "A", "exp": "「言わんばかりに」表示他一副再也忍不住了的样子拍了桌子"}, {"q": "その店は、今にも崩れ____古い建物だった。", "opts": ["A. んばかりの", "B. とばかりの", "C. がばかりの", "D. こそばかりの"], "ans": "A", "exp": "「崩れんばかりの」表示那家店是一栋眼看就要倒塌的老建筑"}]}};
</script>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<title>JLPT N1 文法カード</title>
<script>
/* ═══════════════════════════════════════════════════════
   JLPT Grammar Card Engine v3
   • Card mode (flip cards, ← → keys)
   • Grid mode (search + filter)
   • Furigana + POS coloring (per-card AI analysis)
   • Vocab notebook (cross-level, localStorage)

   ═══════════════════════════════════════════════════════ */

const CARD_ST_KEY  = 'jlpt_card_state';

/* ─── CSS ─── */
const SHARED_CSS = `
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --mint:#6dc9a8;--ml:#e6f7f1;--mm:#a8ddc9;

  --pv:#e8f5e9;--pvt:#2e7d32;
  --pa:#fff3e0;--pat:#e65100;
  --pad:#f3e5f5;--padt:#6a1b9a;
  --pp:#fce4ec;--ppt:#c62828;
  --pc:#e0f7fa;--pct:#006064;
  --px:#fff8e1;--pxt:#f57f17;
}
body{font-family:'M PLUS Rounded 1c','Noto Sans JP',sans-serif;min-height:100%;overflow-y:auto;overflow-x:hidden;overscroll-behavior-y:contain}

/* topbar */
.topbar{background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.08);padding:10px 18px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100;flex-wrap:wrap}

.tb-back:hover{background:rgba(0,0,0,.12)}
.lvl-badge{color:#fff;font-weight:900;font-size:11px;line-height:1.1;padding:5px 9px;border-radius:7px;text-align:center}
.lvl-badge span{display:block;font-size:17px}
.tb-title{font-size:16px;font-weight:900;color:var(--navy)}

.tb-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.cnt-badge{background:var(--ml);color:var(--mint);font-size:12px;font-weight:700;padding:4px 12px;border-radius:20px;border:1.5px solid var(--mm)}

.vbtn.on{background:#fff;color:var(--navy);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.cfg-btn{background:none;border:1.5px solid #ddd;border-radius:8px;padding:4px 10px;font-size:12px;cursor:pointer;color:var(--gr);font-family:inherit}
.cfg-btn:hover{border-color:var(--mint);color:var(--mint)}

/* filter bar */
.fbar{padding:10px 18px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex-wrap:wrap}
.fbar::-webkit-scrollbar{display:none}
.fbtn{background:rgba(255,255,255,.25);border:1.5px solid rgba(255,255,255,.5);color:#fff;font-family:inherit;font-size:11px;font-weight:700;padding:5px 12px;border-radius:20px;cursor:pointer;white-space:nowrap;transition:all .15s}
.fbtn:hover,.fbtn.on{background:#fff;border-color:#fff}

/* progress */
.prog-wrap{padding:6px 18px 4px;background:rgba(255,255,255,.1)}
.prog-info{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.prog-lbl{font-size:11px;font-weight:700;color:rgba(255,255,255,.85)}
.prog-stats{display:flex;gap:12px;font-size:11px;font-weight:700;color:rgba(255,255,255,.85)}
.prog-track{height:3px;background:rgba(255,255,255,.25);border-radius:2px;overflow:hidden}
.prog-fill{height:100%;background:rgba(255,255,255,.8);border-radius:2px;transition:width .35s}

/* stats bar (grid) */
.sbar{display:flex;gap:14px;padding:8px 18px 2px;font-size:12px;color:rgba(255,255,255,.8);font-weight:600}

/* ═══ CARD STAGE ═══ */
.cstage{display:none;flex:1;align-items:flex-start;justify-content:center;padding:14px 18px 90px;overflow:visible}
.cstage.on{display:flex}
.fcard{width:100%;max-width:700px;background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,.13);animation:cIn .22s ease}
@keyframes cIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.aL{animation:sL .18s ease forwards}
.aR{animation:sR .18s ease forwards}
@keyframes sL{to{opacity:0;transform:translateX(-50px)}}
@keyframes sR{to{opacity:0;transform:translateX(50px)}}

/* card head */
.chead{background:var(--ybg);padding:20px 24px 16px;border-bottom:2px dashed var(--mm);display:flex;align-items:flex-start;gap:14px;position:relative}
.cnum{color:#fff;font-size:11px;font-weight:900;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}
.chead-info{flex:1}
.chead-row{display:flex;align-items:center;gap:8px;flex:1;flex-wrap:nowrap}

.c-gram{font-size:28px;font-weight:900;color:var(--navy);line-height:1.2}
.c-gram .hl{color:var(--red)}
.ctags{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center}
.ctag{font-size:10px;font-weight:700;padding:2px 8px;border-radius:5px}
.cdiff{font-size:14px;letter-spacing:2px;color:#f5b942}
.cbtns{display:flex;gap:8px;align-items:flex-start;flex-shrink:0}
.cact{width:40px;height:40px;border-radius:12px;border:1.5px solid #e0e0e0;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:20px;transition:all .15s}
.cact:hover{border-color:var(--mint);transform:scale(1.06)}
.cact.fav{background:#fff9e6;border-color:#f5c518}
.cact.mst{background:var(--ml);border-color:var(--mint)}
.mst-rib{display:none;position:absolute;top:16px;right:110px;background:var(--ml);color:var(--mint);border:1.5px solid var(--mint);border-radius:20px;padding:3px 12px;font-size:11px;font-weight:900}
.mst-rib.on{display:block}

/* card body */
.cbody{padding:22px 26px 26px;display:flex;flex-direction:column;gap:16px}
.slbl{font-size:10px;font-weight:900;color:var(--mint);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:5px}
.c-meaning{font-size:15px;font-weight:700;color:var(--tx);line-height:1.65}
.c-mzh{font-size:13px;color:var(--gr);margin-top:4px}
.c-pat{background:var(--ml);border:1.5px solid var(--mm);border-radius:12px;padding:11px 15px;font-size:14px;font-weight:700;color:var(--navy);line-height:1.6}
.c-pat .gram{color:var(--red);font-weight:900}

/* ─── FURIGANA SYSTEM ─── */
.furi-wrap{display:flex;flex-wrap:wrap;align-items:flex-end;gap:0;line-height:2.8;font-size:15px}
.fw{display:inline-flex;flex-direction:column;align-items:center;margin:0 1px;border-radius:5px;padding:1px 3px 2px;cursor:default;position:relative}
.fw:hover{opacity:.72}
.fr{font-size:9.5px;line-height:1;color:#999;min-height:12px;text-align:center;white-space:nowrap;font-weight:400}
.ft{font-size:16px;font-weight:700;line-height:1.2;white-space:nowrap;border-radius:4px;padding:1px 3px}
.fpunc{display:inline-flex;flex-direction:column;align-items:center;margin-left:-2px}.fpunc .fr{min-height:12px;font-size:9.5px;line-height:1;display:block}.fpunc .ft{font-size:16px;font-weight:700;color:var(--tx);line-height:1.2;padding:1px 0}
/* grammar highlight */
.fw.isG .ft{color:var(--red)!important;background:rgba(232,70,74,.1)!important;font-weight:900}
.fw.isG .fr{color:var(--red)}
/* POS colors */
.pN .ft{color:var(--pnt);background:var(--pn)}
.pV .ft{color:var(--pvt);background:var(--pv)}
.pA .ft{color:var(--pat);background:var(--pa)}
.pD .ft{color:var(--padt);background:var(--pad)}
.pP .ft{color:var(--ppt);background:var(--pp)}
.pC .ft{color:var(--pct);background:var(--pc)}
.pX .ft{color:var(--pxt);background:var(--px)}
/* plain (not yet analyzed) */
.plain-ex{font-size:16px;font-weight:700;color:var(--tx);line-height:1.7}
.plain-ex .hl{color:var(--red);font-weight:900}

/* POS legend */
.pos-legend{display:none;gap:6px;flex-wrap:wrap;padding:8px 12px;background:#f8f8f8;border-radius:8px}
.pleg{display:flex;align-items:center;gap:3px;font-size:10.5px;font-weight:700}
.pleg-dot{width:9px;height:9px;border-radius:2px}

/* analyze btn */
.ana-btn{background:linear-gradient(135deg,#6dc9a8,#10ac84);color:#fff;border:none;border-radius:10px;padding:8px 16px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;display:none;align-items:center;gap:6px;transition:opacity .15s}
.ana-btn:hover{opacity:.88}
.ana-btn:disabled{opacity:.45;cursor:wait}
.spin{display:inline-block;width:12px;height:12px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* example blocks */
.exb{border-radius:12px;padding:14px 16px 10px;border:1.5px solid #eee;margin-bottom:10px}
.exb.main,.exb.sub{background:#fafafa;border-color:#eee}
.exb.sub{background:#fafafa}
.ex-zh{font-size:12.5px;color:var(--gr);margin-top:4px;line-height:1.5}
.playable-ex{cursor:pointer;transition:border-color .16s, background .16s, box-shadow .16s, transform .08s}
.playable-ex:active{transform:scale(.995)}
.exb.playing,.gei.playing,.mex.playing{border-color:#6dc9a8 !important;background:rgba(109,201,168,.10) !important;box-shadow:0 0 0 2px rgba(109,201,168,.16)}
.exb.playable-ex:not(.playing),.gei.playable-ex:not(.playing),.mex.playable-ex:not(.playing){background:#fafafa !important;border-color:#eee !important;box-shadow:none !important}
.mex.playing{border-radius:10px;padding:6px 8px}

/* AI gen */
.ai-btn{border:none;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;font-family:inherit;font-size:12px;font-weight:700;padding:8px 16px;border-radius:10px;cursor:pointer;display:none;align-items:center;gap:6px;transition:opacity .15s}
.ai-btn:hover{opacity:.88}
.ai-btn:disabled{opacity:.45;cursor:wait}
.ai-res{background:var(--ml);border-radius:10px;padding:12px 14px;font-size:13px;line-height:1.8;color:#345;display:none;border:1.5px solid var(--mm)}
.ai-res.on{display:block}

/* bottom nav */
.bnav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #eee;padding:10px 20px;display:flex;align-items:center;justify-content:center;gap:10px;z-index:60;box-shadow:0 -4px 20px rgba(0,0,0,.07)}
.nbtn{width:50px;height:50px;border-radius:14px;border:1.5px solid #e0e0e0;background:#f7f7f7;color:var(--navy);font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .12s;user-select:none;font-weight:900}
.nbtn:hover{background:var(--ml);border-color:var(--mint);color:var(--mint)}
.nbtn:active{transform:scale(.9)}
.nbtn:disabled{opacity:.3;cursor:default;pointer-events:none}
.nctr{background:#f5f5f5;border:1px solid #eee;border-radius:10px;padding:8px 20px;font-size:15px;font-weight:900;color:var(--navy);min-width:100px;text-align:center;flex-shrink:0}
.nctr sub{font-size:11px;font-weight:400;color:var(--gr)}
.nextra{display:flex;gap:6px}
.nxbtn{border:1px solid #e0e0e0;background:#f7f7f7;color:var(--gr);font-family:inherit;font-size:11px;font-weight:700;padding:5px 12px;border-radius:20px;cursor:pointer;transition:all .12s}
.nxbtn:hover{border-color:var(--mint);color:var(--mint)}

/* ═══ GRID STAGE ═══ */
.gstage{display:none}
.gstage.on{display:block}
.srch-wrap{padding:12px 18px 0}
.srch{width:100%;max-width:560px;padding:9px 18px;border-radius:30px;border:none;background:rgba(255,255,255,.92);font-family:inherit;font-size:14px;color:var(--navy);box-shadow:0 2px 10px rgba(0,0,0,.08);outline:none}
.srch:focus{background:#fff}
.srch::placeholder{color:#aaa}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px;padding:16px 18px 80px;max-width:1400px;margin:0 auto}
.gc{background:#fff;border-radius:16px;overflow:hidden;box-shadow:var(--sh);transition:transform .2s,box-shadow .2s;display:flex;flex-direction:column}
.gc:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(0,0,0,.13)}
.gch{background:var(--ybg);border-bottom:2px dashed var(--mm);padding:10px 16px 9px;display:flex;align-items:center;gap:8px;cursor:pointer}
.gnum{color:#fff;font-size:10px;font-weight:900;min-width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.gt{font-size:17px;font-weight:900;color:var(--navy);flex:1;line-height:1.3}
.gt .hl{color:var(--red)}
.gd{font-size:12px;color:#f5b942;letter-spacing:1px;flex-shrink:0}
.gtag{font-size:9px;padding:2px 6px;border-radius:4px;font-weight:700;white-space:nowrap}
.gea{padding:13px 16px 10px;background:var(--cream)}
.gejp{font-size:15px;font-weight:700;color:var(--tx);line-height:1.7}
.gejp .hl{color:var(--red);font-weight:900}
.gezh{font-size:11.5px;color:var(--gr);margin-top:3px;line-height:1.5}
.gi{padding:7px 16px;display:flex;flex-direction:column;gap:5px}
.gmb{background:var(--ml);border-left:3px solid var(--mint);border-radius:0 7px 7px 0;padding:6px 11px;font-size:12px;color:#456}
.gmb .lb{font-size:9px;font-weight:900;color:var(--mint);letter-spacing:1px;text-transform:uppercase;display:block;margin-bottom:2px}
.gpb{background:#fff;border:1.5px solid var(--mm);border-radius:7px;padding:6px 11px;font-size:12px;color:var(--navy)}
.gpb .lb{font-size:9px;font-weight:900;color:var(--gr);letter-spacing:1px;text-transform:uppercase;display:block;margin-bottom:2px}
.gpb code{font-family:inherit;font-weight:700}
.gpb code .gram{color:var(--red);font-weight:900}
.gmt{padding:5px 16px;background:none;border:none;font-family:inherit;font-size:11px;color:var(--mint);font-weight:700;cursor:pointer;display:flex;align-items:center;gap:3px;width:100%;text-align:left}
.gme{display:none;padding:3px 16px 13px;flex-direction:column;gap:5px}
.gme.on{display:flex}
.gei{font-size:11.5px;color:#555;line-height:1.6;padding:5px 11px;background:#f5f5f5;border-radius:7px}
.gei .gm{color:var(--red);font-weight:900}
.gei .tr{font-size:10.5px;color:var(--gr);display:block;margin-top:1px}
.empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:rgba(255,255,255,.7);font-size:16px}

/* modal */
.mov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:center;justify-content:center;padding:20px}
.mov.on{display:flex}
.mo{background:#fff;border-radius:18px;max-width:500px;width:100%;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.moh{background:var(--ybg);border-bottom:2px dashed var(--mm);padding:14px 18px;display:flex;align-items:center;gap:10px}
.moc{margin-left:auto;background:none;border:none;font-size:22px;cursor:pointer;color:var(--gr);line-height:1;padding:0 4px}
.mob{padding:14px 18px 22px;display:flex;flex-direction:column;gap:10px}
.mex{font-size:17px;font-weight:700;line-height:1.8;color:var(--tx)}
.mex .hl{color:var(--red);font-weight:900}
.mo::-webkit-scrollbar{width:4px}
.mo::-webkit-scrollbar-thumb{background:var(--mm);border-radius:4px}

/* ─── POS TOOLTIP ─── */
.pos-tip{position:fixed;z-index:99999;background:#2a3f6e;color:#fff;border-radius:8px;padding:4px 10px;font-size:11px;font-weight:700;pointer-events:none;display:none;white-space:nowrap}

@media(max-width:600px){
  .grid{grid-template-columns:1fr;padding:8px 10px 86px}
  .c-gram{font-size:22px;line-height:1.14}
  .cbody{padding:13px 14px 15px;gap:10px}
  .c-meaning{font-size:13.6px;line-height:1.52}
  .c-mzh{font-size:10.5px;opacity:.76}
  .c-pat{font-size:11.8px;padding:8px 10px;border-radius:9px}
  .exb{padding:11px 12px 9px;border-radius:12px;margin-bottom:7px}
  .ft,.plain-ex{font-size:14px}
  .furi-wrap{line-height:2.3}
  .ex-zh{font-size:10.2px;opacity:.74}
  .bnav{padding:7px 10px}
  .nbtn{width:42px;height:42px;font-size:18px}
  .nctr{padding:7px 14px;font-size:13px;min-width:84px}
  .nextra{display:flex}
  .topbar{padding:8px 12px;gap:8px}
  .tb-title{font-size:13px;line-height:1.35}
  .cnt-badge{display:none}
  .lvl-badge{font-size:10px;padding:4px 7px}
  .lvl-badge span{font-size:14px}
  .cfg-btn{padding:4px 8px;font-size:11px}
}
/* ─── FLIP BUTTON & BACK PANEL ─── */
.flip-btn{width:100%;margin-top:14px;padding:11px;border-radius:12px;border:1.5px dashed var(--mm);background:var(--ml);color:var(--mint);font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;transition:all .15s}
.flip-btn:hover:not(:disabled){background:var(--mint);color:#fff;border-style:solid}
.flip-btn:disabled{opacity:.4;cursor:default}
.fcard-back-panel{background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,.13);width:100%;max-width:700px}
.back-header{background:var(--ybg);border-bottom:2px dashed var(--mm);padding:14px 20px;display:flex;align-items:center;gap:12px}
.flip-back-btn{border:none;background:rgba(0,0,0,.07);border-radius:8px;padding:5px 12px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;color:var(--navy)}
.flip-back-btn:hover{background:rgba(0,0,0,.12)}
.back-title{font-size:14px;font-weight:900;color:var(--navy)}
.back-body{padding:18px 20px 24px;display:flex;flex-direction:column;gap:14px;max-height:70vh;overflow-y:auto}
.back-section{display:flex;flex-direction:column;gap:7px}
.back-label{font-size:10px;font-weight:900;letter-spacing:2px;color:var(--mint);text-transform:uppercase}
.back-analysis{font-size:13px;line-height:1.85;color:#345;background:var(--ml);border-left:3px solid var(--mint);border-radius:0 8px 8px 0;padding:10px 14px}
.back-mistakes{font-size:12.5px;line-height:1.9;color:#456;background:#fff9f0;border-left:3px solid #f5a030;border-radius:0 8px 8px 0;padding:10px 14px}
.back-similar{display:flex;flex-direction:column;gap:6px}
.similar-item{display:flex;gap:8px;font-size:12.5px;line-height:1.6;padding:5px 0;border-bottom:1px solid #f0f0f0}
.similar-item:last-child{border-bottom:none}
.similar-form{font-weight:900;color:var(--navy);white-space:nowrap;min-width:fit-content}
.similar-diff{color:var(--gr)}
.quiz-item{background:#f8f8f8;border-radius:12px;padding:13px 15px;border:1.5px solid #eee}
.quiz-q{font-size:13px;font-weight:700;color:var(--navy);margin-bottom:10px;line-height:1.6}
.quiz-opts{display:flex;flex-direction:column;gap:5px}
.quiz-opt{font-size:12.5px;padding:7px 11px;border-radius:8px;cursor:pointer;border:1.5px solid #e0e0e0;background:#fff;color:#456;transition:all .15s;text-align:left;font-family:inherit;width:100%}
.quiz-opt:hover:not(.correct):not(.wrong){border-color:var(--mint);background:var(--ml)}
.quiz-opt.correct{background:#e8f8f3;border-color:var(--mint);color:var(--mint);font-weight:900}
.quiz-opt.wrong{background:#fef0f0;border-color:#e84a4a;color:#c0392b}
.quiz-exp{font-size:11.5px;color:#666;margin-top:7px;padding:7px 10px;background:#efefef;border-radius:7px;display:none;line-height:1.6}
.quiz-exp.show{display:block}
.no-back{text-align:center;padding:40px 20px;color:var(--gr);font-size:13px}

`;

class GrammarApp {
  constructor(cfg) {
    this.level    = cfg.level;
    this.color    = cfg.color;
    this.bg       = cfg.bgGradient;
    this.G        = cfg.grammar;
    this.fgs      = cfg.filterGroups || [];
    this.label    = cfg.levelLabel || cfg.level;

    this.view     = 'card';
    this.filter   = 'all';
    this.search   = '';
    this.curMod   = null;
    this.deck     = [...this.G];
    this.cur      = 0;
    this.kCache   = {};
    this.kCur     = null;
    // per-card furigana cache  { cardId: [{text,reading,pos,isGram},...] }
    // 从 localStorage 加载已分析的注音缓存
    this._furiKey = 'jlpt_furi_' + (cfg.level || 'XX');
    try { this.furiCache = JSON.parse(localStorage.getItem(this._furiKey) || '{}'); }
    catch { this.furiCache = {}; }

    try { this.cs = JSON.parse(localStorage.getItem(CARD_ST_KEY) || '{}'); }
    catch { this.cs = {}; }
    if (!this.cs.favs)     this.cs.favs = {};
    if (!this.cs.mastered) this.cs.mastered = {};

    const s = document.createElement('style');
    s.textContent = SHARED_CSS;
    document.head.insertBefore(s, document.head.firstChild);
    document.body.style.background = this.bg;

    this._buildHTML();
    this._bind();
    this._setView('card');
    this._initSwipe();
    if (window.speechSynthesis)
      window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
  }

  /* ─────────── BUILD HTML ─────────── */

    const fg = this.fgs;
    document.body.innerHTML = `

          <div class="pleg"><div class="pleg-dot" style="background:#ffe082"></div>助动词</div>
          <div class="pleg" style="color:var(--red)"><div class="pleg-dot" style="background:var(--red)"></div>语法</div>
        </div>
